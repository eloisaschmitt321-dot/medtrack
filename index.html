<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>MedTrack — Planner de Medicina</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='9' fill='%23f9a8d4'/%3E%3Cpath d='M16 8v16M8 16h16' stroke='%23fff' stroke-width='3.2' stroke-linecap='round'/%3E%3C/svg%3E">
<style>
/* =======================================================================
   MedTrack — versão sem framework.
   HTML + CSS + JavaScript puros, num arquivo só. Sem React, sem módulos,
   sem build: abre com dois cliques em qualquer navegador.
   ======================================================================= */

:root{
  --bg:#fdf6f9; --surface:#fff; --surface2:#faf3f6; --line:#eee2e8;
  --ink:#2b2227; --muted:#82737b;
  --accent:#db2777; --accent-soft:#fce7f3;
  --accent2:#0f8a54; --accent2-soft:#dcf5e9;
  --amber:#b45309; --amber-soft:#fef3c7;
  --red:#be123c; --red-soft:#ffe4e6;
  --radius:14px;
}
html.escuro{
  --bg:#161215; --surface:#1f1a1e; --surface2:#272025; --line:#382f36;
  --ink:#f4eef1; --muted:#a598a0;
  --accent:#f48fbe; --accent-soft:#3e1e2f;
  --accent2:#6ee2ac; --accent2-soft:#18382b;
  --amber:#fcd34d; --amber-soft:#3a2c0d;
  --red:#fda4af; --red-soft:#3d1720;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;height:100%}
body{
  background:var(--bg); color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  font-size:15px; line-height:1.5; -webkit-font-smoothing:antialiased;
}
a{color:var(--accent);text-decoration:none}
code{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:.85em}

/* -------- estrutura -------- */
#app{display:flex;min-height:100%}
#lateral{
  width:236px;flex:0 0 236px;background:var(--surface);border-right:1px solid var(--line);
  padding:16px 12px;position:sticky;top:0;height:100vh;overflow-y:auto
}
#conteudo{flex:1;min-width:0;padding:24px 28px 90px;max-width:1180px;margin:0 auto;width:100%}
#topo{display:none}

.marca{display:flex;align-items:center;gap:10px;padding:0 8px 14px}
.marca .logo{width:32px;height:32px;border-radius:10px;background:var(--accent);color:#fff;
  display:flex;align-items:center;justify-content:center;font-weight:700}
.marca b{display:block;font-size:15px;line-height:1.1}
.marca span{font-size:10px;color:var(--muted)}

.grupo{font-size:10px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;
  color:var(--muted);opacity:.75;padding:12px 10px 4px}
.item{display:flex;align-items:center;gap:9px;padding:7px 10px;border-radius:10px;
  color:var(--muted);font-size:14px;font-weight:500;cursor:pointer;
  transition:background .18s,color .18s}
.item:hover{background:var(--surface2);color:var(--ink)}
.item.ativo{background:var(--accent-soft);color:var(--accent)}
.item .badge{margin-left:auto;background:var(--accent);color:#fff;border-radius:99px;
  font-size:10px;font-weight:700;padding:1px 6px}

/* -------- componentes -------- */
.cartao{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);
  padding:16px 18px;margin-bottom:16px}
.cartao h2{margin:0 0 12px;font-size:14px;font-weight:600}
.cabecalho{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;
  gap:12px;margin-bottom:18px}
.cabecalho h1{margin:0;font-size:26px;letter-spacing:-.02em}
.cabecalho p{margin:4px 0 0;font-size:13px;color:var(--muted)}

.grade{display:grid;gap:14px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.g21{grid-template-columns:2fr 1fr}

.num{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:14px}
.num .rot{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.num .val{font-size:24px;font-weight:700;margin-top:4px;font-variant-numeric:tabular-nums}
.num .dica{font-size:11px;color:var(--muted);margin-top:4px}
.num.destaque{background:var(--accent-soft);border-color:transparent}
.num.destaque .val{color:var(--accent)}

button{font:inherit}
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);
  background:var(--surface);color:var(--ink);border-radius:10px;padding:7px 13px;
  font-size:13px;font-weight:500;cursor:pointer;transition:filter .15s,transform .1s}
.btn:hover{filter:brightness(.97)}
.btn:active{transform:scale(.98)}
.btn.primario{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.suave{background:var(--accent-soft);border-color:transparent;color:var(--accent)}
.btn.mini{padding:3px 9px;font-size:12px;border-radius:8px}
.btn.perigo{color:var(--red);border-color:transparent;background:transparent}

input,select,textarea{
  width:100%;border:1px solid var(--line);background:var(--surface);color:var(--ink);
  border-radius:10px;padding:8px 10px;font:inherit;font-size:14px}
input:focus,select:focus,textarea:focus{outline:2px solid var(--accent);outline-offset:-1px}
textarea{min-height:70px;resize:vertical}
label.campo{display:block;margin-bottom:12px}
label.campo>span{display:block;font-size:11px;font-weight:600;color:var(--muted);margin-bottom:5px}

.selo{display:inline-flex;align-items:center;gap:5px;border-radius:99px;padding:2px 9px;
  font-size:11px;font-weight:600;background:var(--surface2);color:var(--muted);white-space:nowrap}
.selo.rosa{background:var(--accent-soft);color:var(--accent)}
.selo.verde{background:var(--accent2-soft);color:var(--accent2)}
.selo.ambar{background:var(--amber-soft);color:var(--amber)}
.selo.vermelho{background:var(--red-soft);color:var(--red)}

.barra{height:8px;border-radius:99px;background:var(--surface2);overflow:hidden}
.barra>i{display:block;height:100%;border-radius:99px;background:var(--accent);
  transition:width .5s ease}
.barra.fina{height:5px}

.lista{list-style:none;margin:0;padding:0}
.lista>li{display:flex;align-items:flex-start;gap:10px;padding:9px 0;
  border-top:1px solid var(--line)}
.lista>li:first-child{border-top:0}

.caixa{width:19px;height:19px;flex:0 0 19px;margin-top:2px;border:1px solid var(--line);
  border-radius:6px;background:var(--surface);cursor:pointer;display:flex;
  align-items:center;justify-content:center;color:#fff;font-size:12px;line-height:1}
.caixa.marcada{background:var(--accent);border-color:var(--accent)}

.tarefa{flex:1;min-width:0}
.tarefa .t{font-size:14px;font-weight:500}
.tarefa .d{font-size:12px;color:var(--muted);margin-top:2px}
.tarefa .p{font-size:11px;color:var(--accent);margin-top:3px}
.feita .t{text-decoration:line-through;opacity:.55}
.feita .d{opacity:.55}
.min{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums;
  cursor:pointer;padding:2px 6px;border-radius:7px}
.min:hover{background:var(--surface2);color:var(--ink)}

.vazio{text-align:center;color:var(--muted);font-size:13px;padding:26px 10px}

.aviso{border-radius:12px;padding:11px 14px;font-size:12px;margin-bottom:14px;line-height:1.55}
.aviso.at{background:var(--amber-soft);color:var(--amber)}
.aviso.cr{background:var(--red-soft);color:var(--red)}
.aviso.inf{background:var(--surface2);color:var(--muted)}

.destaque-vest{background:linear-gradient(160deg,var(--accent-soft),var(--surface))}
.dias{font-size:34px;font-weight:700;line-height:1;font-variant-numeric:tabular-nums}

table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.05em;
  color:var(--muted);padding:6px 8px;border-bottom:1px solid var(--line)}
td{padding:7px 8px;border-bottom:1px solid var(--line)}
tr:last-child td{border-bottom:0}

.abas{display:inline-flex;gap:4px;background:var(--surface2);border:1px solid var(--line);
  border-radius:11px;padding:4px;margin-bottom:16px;flex-wrap:wrap}
.abas button{border:0;background:transparent;color:var(--muted);font-size:12px;font-weight:600;
  padding:6px 12px;border-radius:8px;cursor:pointer}
.abas button.on{background:var(--surface);color:var(--accent)}

#fundo{position:fixed;inset:0;background:rgba(0,0,0,.4);display:none;z-index:40}
#fundo.on{display:block}
#modal{position:fixed;z-index:50;left:50%;top:50%;transform:translate(-50%,-50%);
  width:min(520px,94vw);max-height:88vh;overflow-y:auto;background:var(--surface);
  border:1px solid var(--line);border-radius:18px;padding:20px;display:none}
#modal.on{display:block}
#modal h3{margin:0 0 14px;font-size:16px}
.acoes{display:flex;justify-content:flex-end;gap:8px;margin-top:18px}

#aviso-flutuante{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);
  background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:11px;
  font-size:13px;z-index:60;display:none;max-width:90vw}
#aviso-flutuante.on{display:block}

.mapa{display:flex;gap:3px;flex-wrap:wrap}
.mapa i{width:11px;height:11px;border-radius:3px;background:var(--surface2);display:block}

.colunas{display:flex;gap:3px;overflow-x:auto;padding-bottom:4px}
.colunas>div{display:flex;flex-direction:column;gap:3px}
.colunas i{width:11px;height:11px;border-radius:3px;background:var(--surface2);display:block}

/* -------- responsivo -------- */
@media (max-width:960px){
  .g4{grid-template-columns:repeat(2,minmax(0,1fr))}
  .g3,.g2,.g21{grid-template-columns:1fr}
}
@media (max-width:820px){
  #lateral{display:none}
  #lateral.aberto{display:block;position:fixed;z-index:45;left:0;top:0;height:100vh;width:250px}
  #topo{display:flex;align-items:center;gap:10px;position:sticky;top:0;z-index:30;
    background:var(--bg);border-bottom:1px solid var(--line);padding:10px 14px}
  #conteudo{padding:18px 14px 90px}
  .cabecalho h1{font-size:22px}
}
</style>
</head>
<body>

<div id="app">
  <aside id="lateral"></aside>
  <div style="flex:1;min-width:0">
    <header id="topo">
      <button class="btn mini" id="btn-menu">☰</button>
      <div class="marca" style="padding:0"><div class="logo">M</div><div><b>MedTrack</b></div></div>
      <button class="btn mini" id="btn-tema-mobile" style="margin-left:auto">◐</button>
    </header>
    <main id="conteudo"><p class="vazio">Carregando…</p></main>
  </div>
</div>

<div id="fundo"></div>
<div id="modal"></div>
<div id="aviso-flutuante"></div>

<script>
/* =======================================================================
   1. UTILIDADES
   ======================================================================= */
var DIAS_CURTO = ['Dom','Seg','Ter','Qua','Qui','Sex','Sáb'];
var DIAS_LONGO = ['Domingo','Segunda-feira','Terça-feira','Quarta-feira','Quinta-feira','Sexta-feira','Sábado'];
var MESES = ['janeiro','fevereiro','março','abril','maio','junho','julho','agosto','setembro','outubro','novembro','dezembro'];

function pad(n){ return (n<10?'0':'')+n; }
function iso(d){ return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate()); }
function deISO(s){ var p=String(s).split('-'); return new Date(+p[0], (+p[1])-1, +p[2]); }
function hojeISO(){ return iso(new Date()); }
function somaDias(s,n){ var d=deISO(s); d.setDate(d.getDate()+n); return iso(d); }
function difDias(a,b){ return Math.round((deISO(b)-deISO(a))/86400000); }
function diaSemana(s){ return deISO(s).getDay(); }
function inicioSemana(s){ var w=diaSemana(s); return somaDias(s, w===0?-6:1-w); }
function dataBR(s){ var d=deISO(s); return pad(d.getDate())+'/'+pad(d.getMonth()+1)+'/'+d.getFullYear(); }
function dataCurta(s){ var d=deISO(s); return pad(d.getDate())+'/'+pad(d.getMonth()+1); }
function dataLonga(s){ var d=deISO(s); return DIAS_LONGO[d.getDay()]+', '+d.getDate()+' de '+MESES[d.getMonth()]; }

function horas(min){
  if(!min||min<=0) return '0h';
  var h=Math.floor(min/60), m=Math.round(min%60);
  if(!h) return m+'min';
  return m ? h+'h'+pad(m) : h+'h';
}
function perc(a,b){ return b? Math.max(0,Math.min(100,Math.round(a/b*100))) : 0; }
function soma(lista,f){ var t=0; for(var i=0;i<lista.length;i++) t+=f?f(lista[i]):lista[i]; return t; }
function id(p){ return (p||'id')+'_'+Math.random().toString(36).slice(2,9)+Date.now().toString(36).slice(-3); }
function esc(s){
  return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;')
    .replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
/* hash determinístico: mesma chave devolve sempre o mesmo número dentro da faixa,
   para que recalcular a semana não reembaralhe a quantidade de questões */
function faixaEstavel(chave,min,max){
  if(max<=min) return min;
  var h=2166136261;
  for(var i=0;i<chave.length;i++){ h^=chave.charCodeAt(i); h=(h*16777619)>>>0; }
  return min + (h % (max-min+1));
}
function arred5(m,piso){ return Math.max(piso||15, Math.round(m/5)*5); }

/* =======================================================================
   2. ARMAZENAMENTO
   ======================================================================= */
var VERSAO='6.2';
var CHAVE='medtrack.v2';
var PRECISA_REGERAR=false;
var DADOS_VIERAM_DO_ARQUIVO=false;
var memoria={}, semDisco=false;

function ler(){
  try{ return window.localStorage.getItem(CHAVE); }
  catch(e){ semDisco=true; return memoria[CHAVE]||null; }
}
function gravar(v){
  try{ if(!semDisco){ window.localStorage.setItem(CHAVE,v); return; } }
  catch(e){ semDisco=true; }
  memoria[CHAVE]=v;
}

var salvarTimer=null;
var sincTimer=null;
function salvarJa(){
  if(salvarTimer){ clearTimeout(salvarTimer); salvarTimer=null; }
  gravar(JSON.stringify(E));
}
function salvar(){
  E.ultimaAlteracao=new Date().toISOString();   /* usado para decidir quem vence na junção */
  if(salvarTimer) clearTimeout(salvarTimer);
  salvarTimer=setTimeout(function(){ salvarTimer=null; gravar(JSON.stringify(E)); },120);
  /* manda para a sala alguns segundos depois da última mexida */
  if(typeof podeSincronizar==='function' && podeSincronizar()){
    if(sincTimer) clearTimeout(sincTimer);
    sincTimer=setTimeout(function(){ sincEnviar(true); },4000);
  }
}

/* =======================================================================
   3. DADOS INICIAIS
   ======================================================================= */
var DISCIPLINAS=[
  ['biologia','Biologia','#10b981',false,3,['Citologia*','Metabolismo energético*','Genética mendeliana*','Biologia molecular*','Ecologia*','Evolução','Fisiologia humana*','Botânica','Zoologia','Histologia','Embriologia','Microbiologia e imunologia']],
  ['quimica','Química','#8b5cf6',true,4,['Estequiometria*','Soluções*','Termoquímica*','Cinética química*','Equilíbrio químico*','Eletroquímica*','Química orgânica — funções*','Reações orgânicas*','Atomística e tabela periódica','Ligações químicas','Ácidos e bases*','Radioatividade']],
  ['fisica','Física','#3b82f6',true,5,['Cinemática*','Dinâmica*','Trabalho e energia*','Estática e hidrostática*','Termologia e calorimetria*','Termodinâmica','Óptica geométrica*','Ondulatória*','Eletrostática*','Eletrodinâmica*','Eletromagnetismo','Física moderna']],
  ['matematica','Matemática','#f43f5e',true,5,['Funções*','Progressões*','Geometria plana*','Geometria espacial*','Geometria analítica*','Trigonometria*','Análise combinatória*','Probabilidade*','Estatística*','Matemática financeira*','Logaritmos e exponenciais*','Matrizes e sistemas lineares']],
  ['portugues','Português','#ec4899',false,2,['Interpretação de texto*','Sintaxe do período*','Concordância*','Regência e crase*','Morfologia','Semântica*','Figuras de linguagem*','Variação linguística*']],
  ['literatura','Literatura','#a855f7',false,3,['Obras obrigatórias UFSC*','Barroco e Arcadismo','Romantismo*','Realismo e Naturalismo*','Parnasianismo e Simbolismo','Pré-modernismo','Modernismo — 1ª fase*','Modernismo — 2ª e 3ª fases*','Literatura contemporânea']],
  ['redacao','Redação','#14b8a6',false,3,['Estrutura dissertativa*','Repertório sociocultural*','Argumentação*','Proposta de intervenção*','Coesão e coerência*','Gêneros da UFSC*']],
  ['historia','História','#f97316',false,3,['Brasil Colônia','Brasil Império*','República Velha*','Era Vargas*','Ditadura Militar*','História de Santa Catarina*','Idade Média e Moderna','Revoluções*','Guerras Mundiais e Guerra Fria*','História contemporânea']],
  ['geografia','Geografia','#84cc16',false,2,['Geografia de Santa Catarina*','Geopolítica*','Urbanização*','Questões ambientais*','Climatologia*','Geomorfologia','Demografia*','Agropecuária e indústria','Cartografia']],
  ['filosofia','Filosofia','#64748b',false,2,['Filosofia antiga','Filosofia moderna*','Ética*','Política*','Teoria do conhecimento']],
  ['sociologia','Sociologia','#0ea5e9',false,2,['Clássicos da sociologia*','Cultura e identidade*','Trabalho e sociedade*','Movimentos sociais*','Cidadania e direitos*']],
  ['ingles','Inglês','#eab308',false,2,['Interpretação de texto*','Vocabulário e cognatos*','Tempos verbais','Conectivos']],
  ['atualidades','Atualidades','#f59e0b',false,2,['Meio ambiente e clima*','Política internacional*','Saúde pública*','Tecnologia e IA*','Brasil hoje*']]
];

var VESTIBULARES=[
  ['ufsc','UFSC',['2026-12-05','2026-12-06'],1,10,true,'#ec4899','Prioridade máxima. Prova por sistema de somatório.'],
  ['ufpr','UFPR',['2026-11-01'],2,8,true,'#10b981',''],
  ['unesp','UNESP',['2026-11-22'],2,8,false,'#64748b','Desativado a pedido — não será prestado.'],
  ['uel','UEL',['2026-10-18','2026-10-19'],3,6,true,'#8b5cf6',''],
  ['unicentro','UNICENTRO',['2026-10-11'],3,6,true,'#14b8a6',''],
  ['unioeste','UNIOESTE',['2026-11-29'],3,6,true,'#0ea5e9',''],
  ['uepg','UEPG',['2026-12-13'],3,6,true,'#84cc16',''],
  ['ufsm','UFSM',['2027-01-09','2027-01-10'],4,4,true,'#f97316',''],
  ['enem','ENEM',['2026-11-08','2026-11-15'],5,3,true,'#3b82f6','']
];

/* horário escolar: [dia, [matérias por período]], null = período livre.
   O sufixo "!" marca a aula que ela costuma perder. */
/* Rodízio das provas antigas da UFSC: cada dia puxa o próximo grupo da fila,
   sem repetir até a volta completa. Editável em Configurações. */
var GRUPOS_PA_PADRAO=[
  {id:'humanas',nome:'Humanas',materias:['historia','geografia','filosofia','sociologia']},
  {id:'fisica',nome:'Física',materias:['fisica']},
  {id:'quimica',nome:'Química',materias:['quimica']},
  {id:'ingles',nome:'Inglês',materias:['ingles']},
  {id:'literatura',nome:'Literatura',materias:['literatura']},
  {id:'biologia',nome:'Biologia',materias:['biologia']},
  {id:'matematica',nome:'Matemática',materias:['matematica']}
];

var HORARIO=[
  [1,['matematica','quimica',null,'biologia','quimica','biologia']],
  [2,['fisica','redacao','fisica','filosofia','redacao','fisica','sociologia']],
  [3,['literatura','portugues','fisica','quimica','biologia!','quimica!','portugues']],
  [4,[null,null,null,'historia','biologia','matematica',null,'historia','matematica','historia','biologia']],
  [5,['geografia',null,'matematica','geografia','ingles','matematica','geografia']]
];

function estadoInicial(){
  var hoje=hojeISO();
  var disc=[];
  for(var i=0;i<DISCIPLINAS.length;i++){
    var d=DISCIPLINAS[i], topicos=[];
    for(var j=0;j<d[5].length;j++){
      var nome=d[5][j], alta=nome.charAt(nome.length-1)==='*';
      if(alta) nome=nome.slice(0,-1);
      topicos.push({id:'t'+i+'_'+j, nome:nome, status:'nao_iniciado', alta:alta});
    }
    disc.push({id:d[0],nome:d[1],cor:d[2],exata:d[3],dificuldade:d[4],obs:'',topicos:topicos});
  }
  var vest=[];
  for(var k=0;k<VESTIBULARES.length;k++){
    var v=VESTIBULARES[k];
    vest.push({id:v[0],nome:v[1],datas:v[2],prioridade:v[3],peso:v[4],ativo:v[5],cor:v[6],obs:v[7],
      inscricaoDe:'',inscricao:'',inscrito:false,pago:false,realizado:false,taxa:''});
  }
  var horario=[];
  for(var h=0;h<HORARIO.length;h++){

/* O arquivo guarda o programa; os dados ficam no navegador do aparelho.
   Para levar tudo para outro computador ou celular, o app sabe se exportar
   com os dados embutidos dentro do próprio HTML — é isso que esta função lê. */
function dadosEmbutidos(){
  try{
    var tag=document.getElementById('medtrack-dados');
    if(!tag) return null;
    var bruto=(tag.textContent||'').replace(/^\s+|\s+$/g,'');
    if(!bruto) return null;
    var obj=JSON.parse(bruto);
    return (obj&&obj.config)?obj:null;
  }catch(e){ return null; }
}

var E = (function(){
  var bruto=ler();
  /* aparelho novo, arquivo trazido de outro: adota os dados que vieram junto */
  if(!bruto){
    var vindo=dadosEmbutidos();
    if(vindo){
      DADOS_VIERAM_DO_ARQUIVO=true;
      bruto=JSON.stringify(vindo);
    } else {
      return estadoInicial();
    }
  }
  try{
    var s=JSON.parse(bruto), base=estadoInicial();
    if(!s || typeof s!=='object') return base;
    var primeiraVezGrupos = !s.config || !s.config.gruposPA;
    /* precisa ser lido ANTES do merge abaixo, senão o valor padrão entra e a
       migração nunca roda */
    var precisaPaFds = !s.config || !s.config.paNoFimDeSemana;
    var precisaPaSabado = !s.config || !s.config.blocosPorDia;
    var precisaCotasFds = !s.config || !s.config.aulasPorDia;
    var precisaSimFds = !s.config || !('simuladoFimDeSemana' in s.config);
    for(var k in base){ if(!(k in s)) s[k]=base[k]; }
    for(var c in base.config){ if(!(c in s.config)) s.config[c]=base.config[c]; }
    /* quem já usava a contagem antiga (2 por dia útil, 4 no fim de semana)
       passa para o rodízio de 1–2 matérias por dia */
    if(primeiraVezGrupos){ s.config.blocosDiaUtil=1; s.config.blocosFimSemana=2; }
    /* concentração de provas antigas no fim de semana (v4.3):
       roda uma vez para quem já tinha configuração anterior */
    if(precisaSimFds) s.config.simuladoFimDeSemana=true;
    if(precisaPaFds){
      s.config.paNoFimDeSemana=true;
      s.config.blocosDiaUtil=0;
      s.config.blocosFimSemana=3;
      PRECISA_REGERAR=true;   /* o planejamento antigo precisa ser refeito */
    }
    if(precisaPaSabado){
      var nGrupos=(s.config.gruposPA&&s.config.gruposPA.length)||7;
      s.config.blocosPorDia=[0,0,0,0,0,0,nGrupos];
      PRECISA_REGERAR=true;
    }
    if(precisaCotasFds){
      s.config.aulasPorDia=[3,0,0,0,0,0,2];
      s.config.listasPorDia=[2,0,0,0,0,0,2];
      PRECISA_REGERAR=true;
    }
    return s;
  }catch(e){ return estadoInicial(); }
})();

/* =======================================================================
   4. CONSULTAS AUXILIARES
   ======================================================================= */
function disciplina(idd){
  for(var i=0;i<E.disciplinas.length;i++) if(E.disciplinas[i].id===idd) return E.disciplinas[i];
  return null;
}
function nomeDisc(idd){ var d=disciplina(idd); return d?d.nome:'Geral'; }
function corDisc(idd){ var d=disciplina(idd); return d?d.cor:'#94a3b8'; }
function vestibular(idv){
  for(var i=0;i<E.vestibulares.length;i++) if(E.vestibulares[i].id===idv) return E.vestibulares[i];
  return null;
}
function vestibularPrincipal(){
  var ativos=E.vestibulares.filter(function(v){return v.ativo;});
  ativos.sort(function(a,b){ return a.prioridade-b.prioridade || b.peso-a.peso; });
  return ativos[0]||E.vestibulares[0];
}
function vestibularesOrdenados(){
  var base=hojeISO(), fora=[];
  E.vestibulares.forEach(function(v){
    if(!v.ativo||!v.datas.length) return;
    var futuras=v.datas.slice().sort().filter(function(d){return d>=base;});
    var prox=futuras[0]||v.datas.slice().sort().pop();
    fora.push({v:v,data:prox,dias:difDias(base,prox)});
  });
  fora.sort(function(a,b){return a.dias-b.dias;});
  return fora;
}
function progressoDisc(d){
  if(!d.topicos.length) return 0;
  var s=0;
  d.topicos.forEach(function(t){ s += t.status==='dominado'?1:(t.status==='em_revisao'?.5:0); });
  return Math.round(s/d.topicos.length*100);
}
function progressoGeral(){
  if(!E.disciplinas.length) return 0;
  return Math.round(soma(E.disciplinas,progressoDisc)/E.disciplinas.length);
}
function aproveitamento(idd){
  var qs=E.questoes.filter(function(q){ return !idd || q.materia===idd; });
  var t=soma(qs,function(q){return q.total;});
  return t ? soma(qs,function(q){return q.acertos;})/t*100 : null;
}
function aulasAbertas(idd){
  return E.aulas.filter(function(a){ return a.status==='aberta' && (!idd||a.materia===idd); }).length;
}
function listasPendentes(idd){
  return E.listas.filter(function(l){ return l.status==='pendente' && (!idd||l.materia===idd); }).length;
}
/* Conteúdo em que ela ficou abaixo do limiar entra na fila para voltar alguns
   dias depois. Não é revisão espaçada: é uma única volta agendada, que só se
   repete se ela ficar abaixo do limiar de novo. */
function registrarRetomada(materia,tema,pct,origem){
  var lim=E.config.limiarRetomada||75;
  if(pct===null||pct===undefined||pct>=lim) return null;
  tema=String(tema||'').replace(/^\s+|\s+$/g,'') || nomeDisc(materia);
  E.retomadas=E.retomadas||[];
  var achou=null;
  E.retomadas.forEach(function(r){
    if(r.status==='pendente' && r.materia===materia &&
       String(r.tema).toLowerCase()===tema.toLowerCase()) achou=r;
  });
  var volta=somaDias(hojeISO(),E.config.diasRetomada||10);
  if(achou){
    achou.pct=Math.round(pct);
    achou.voltaEm=volta;
    achou.tentativas=(achou.tentativas||1)+1;
    return achou;
  }
  var nova={id:id('ret'),materia:materia,tema:tema,pct:Math.round(pct),
    origem:origem||'questoes',criadaEm:hojeISO(),voltaEm:volta,
    status:'pendente',tentativas:1};
  E.retomadas.push(nova);
  return nova;
}

function retomadasPendentes(){
  return (E.retomadas||[]).filter(function(r){ return r.status==='pendente'; })
    .sort(function(a,b){ return a.voltaEm.localeCompare(b.voltaEm)||a.pct-b.pct; });
}

function dificuldadesAtivas(mid){
  return (E.dificuldades||[]).filter(function(x){
    return x.ativa && (!mid || x.materia===mid);
  });
}
/* Quanto a disciplina sobe na fila por ter dificuldades declaradas.
   Limitado de propósito: reforça sem atropelar o resto do critério. */
function bonusDificuldade(mid){
  var t=0;
  dificuldadesAtivas(mid).forEach(function(x){ t+=(x.nivel||1)*8; });
  return Math.min(t,36);
}

function materiasDoDia(dia){
  var wd=diaSemana(dia), fora=[];
  E.config.horario.forEach(function(s){
    if(s.dia===wd && s.materia && !s.perdida && fora.indexOf(s.materia)<0) fora.push(s.materia);
  });
  return fora;
}
function materiasPerdidas(dia){
  var wd=diaSemana(dia), fora=[];
  E.config.horario.forEach(function(s){
    if(s.dia===wd && s.materia && s.perdida && fora.indexOf(s.materia)<0) fora.push(s.materia);
  });
  return fora;
}
function capacidade(dia){ return E.config.disponibilidade[diaSemana(dia)]||0; }
function tarefasDoDia(dia){
  return E.tarefas.filter(function(t){return t.data===dia;})
    .sort(function(a,b){ return (a.feita?1:0)-(b.feita?1:0) || a.prioridade-b.prioridade; });
}
function sequencia(){
  var dias={};
  E.sessoes.forEach(function(s){ dias[s.data]=1; });
  E.tarefas.forEach(function(t){ if(t.feita) dias[t.data]=1; });
  var n=0, c=hojeISO();
  if(!dias[c]) c=somaDias(c,-1);
  while(dias[c]){ n++; c=somaDias(c,-1); }
  return n;
}
function horasAteData(alvo){
  var n=difDias(hojeISO(),alvo);
  if(n<=0) return 0;
  var m=0;
  for(var i=0;i<=n;i++) m+=capacidade(somaDias(hojeISO(),i));
  return Math.round(m/60);
}
function fimDeSemanaAte(alvo){
  var n=difDias(hojeISO(),alvo), sab=0, dom=0;
  if(n<0) return {sab:0,dom:0};
  for(var i=0;i<=n;i++){ var w=diaSemana(somaDias(hojeISO(),i)); if(w===6)sab++; if(w===0)dom++; }
  return {sab:sab,dom:dom};
}

/* =======================================================================
   5. MOTOR DO PLANEJAMENTO
   O dia é montado em três camadas: essenciais (duração fixa), núcleo
   garantido (com orçamento — o que não couber volta para a fila) e extras
   (só com folga real).
   ======================================================================= */
var PRIO={revisaoProva:5,redacao:8,simulado:10,aulaPerdida:12,aulaAtrasada:14,
  estudo:18,reforco:19,provaAntiga:20,retomada:21,questoes:22,provaOutras:24,lista:26,obra:28,anki:30};

var ETAPAS_REDACAO=['Repertório e brainstorm','Estrutura e esboço',
  'Escrita da versão final','Revisão e passar a limpo'];

function nota(d,dia,uso){
  var c=E.config, s=progressoDisc(d);
  s += (uso[d.id]||0)*28;                                  /* rodízio da semana */
  if(d.exata) s -= c.pesoExatas;                            /* reforço de exatas */
  s -= (d.dificuldade-3)*c.pesoDificuldade;
  var ap=aproveitamento(d.id);
  if(ap!==null && ap<c.limiarAproveitamento) s-=(c.limiarAproveitamento-ap)*.6;
  s -= Math.min(aulasAbertas(d.id)*5,25);                   /* acúmulo pesa */
  s -= bonusDificuldade(d.id);                              /* dificuldades declaradas */
  if(materiasDoDia(dia).indexOf(d.id)>=0) s-=10;            /* casa com a escola */
  var altas=d.topicos.filter(function(t){return t.alta&&t.status!=='dominado';}).length;
  s -= Math.min(altas*1.5,12);                              /* mais cobrado na UFSC */
  return s;
}
function escolher(dia,uso,exceto){
  var cand=E.disciplinas.filter(function(d){ return exceto.indexOf(d.id)<0; });
  if(!cand.length) return null;
  cand.sort(function(a,b){ return nota(a,dia,uso)-nota(b,dia,uso); });
  return cand[0];
}
function gruposPA(){
  var g=E.config.gruposPA;
  return (g && g.length) ? g : GRUPOS_PA_PADRAO;
}

/* A "nota" do grupo é a da sua matéria mais prioritária no dia. */
function notaGrupo(g,dia){
  var melhor=null;
  (g.materias||[]).forEach(function(mid){
    var d=disciplina(mid);
    if(!d) return;
    var n=nota(d,dia,{});
    if(melhor===null||n<melhor) melhor=n;
  });
  return melhor===null?999:melhor;
}

/* Devolve o próximo grupo da volta. Quando a volta termina, ela é remontada —
   reordenada pela prioridade do momento — e recomeça. Nunca repete dentro da volta. */
function proximoGrupoPA(dia,ctx){
  if(!ctx.cicloPA || !ctx.cicloPA.length || ctx.posPA>=ctx.cicloPA.length){
    var nova=gruposPA().slice().sort(function(a,b){
      return notaGrupo(a,dia)-notaGrupo(b,dia);
    });
    /* a volta nova não pode começar com o grupo que acabou de sair */
    if(nova.length>1 && ctx.ultimoPA && nova[0].id===ctx.ultimoPA){
      var tmp=nova[0]; nova[0]=nova[1]; nova[1]=tmp;
    }
    ctx.cicloPA=nova;
    ctx.posPA=0;
  }
  var g=ctx.cicloPA[ctx.posPA++];
  if(g) ctx.ultimoPA=g.id;
  return g;
}

/* Dentro de um grupo com várias matérias (Humanas), rodízio próprio. */
function materiaDoGrupo(g,dia,ctx){
  var mats=(g.materias||[]).filter(function(mid){ return !!disciplina(mid); });
  if(!mats.length) return null;
  mats.sort(function(a,b){
    var ua=ctx.usoPA[a]||0, ub=ctx.usoPA[b]||0;
    if(ua!==ub) return ua-ub;
    return nota(disciplina(a),dia,{})-nota(disciplina(b),dia,{});
  });
  return mats[0];
}

function montarDia(dia,ctx){
  var c=E.config, cap=capacidade(dia), fora=[];
  if(cap<=0) return fora;
  var principal=vestibularPrincipal();
  var carga=c.diasCarga.indexOf(diaSemana(dia))>=0;
  var materias=materiasDoDia(dia);
  var usados=0;
  function sobra(){ return cap-usados; }
  function por(t){ fora.push(t); usados+=t.minutos; }

  /* ---- camada 1: essenciais ---- */
  por({data:dia,titulo:'Anki do dia',detalhe:'Baralho diário completo.',
    cat:'anki',minutos:c.anki,assinatura:'anki:'+dia,prioridade:PRIO.anki});

  E.provasEscolares.forEach(function(p){
    var d=difDias(dia,p.data);
    if(d<1||d>2) return;
    var feitos=p.conteudos.filter(function(x){return x.feito;}).length;
    por({data:dia,titulo:'Revisão — '+p.titulo,
      detalhe:p.conteudos.length? 'Checklist: '+feitos+'/'+p.conteudos.length+' conteúdos revisados.'
                                : 'Revisão geral do conteúdo da prova.',
      cat:'revisao_prova',minutos:c.revisaoProva,
      assinatura:'revisao_prova:'+p.id+':'+dia,prioridade:PRIO.revisaoProva,ref:p.id});
  });

  materiasPerdidas(dia).forEach(function(m){
    por({data:dia,titulo:'Recuperar aula perdida — '+nomeDisc(m),
      detalhe:'Aula que você perde nesse dia. Recuperar no mesmo dia para não virar acúmulo.',
      cat:'aula_perdida',materia:m,minutos:c.aulaPerdida,
      assinatura:'aula_perdida:'+m+':'+dia,prioridade:PRIO.aulaPerdida});
  });

  E.redacoes.forEach(function(r){
    if(r.status==='entregue') return;
    if(dia<r.temaEm||dia>r.entregaEm) return;
    var janela=Math.max(1,difDias(r.temaEm,r.entregaEm)+1);
    var i=Math.min(ETAPAS_REDACAO.length-1,Math.floor(difDias(r.temaEm,dia)/janela*ETAPAS_REDACAO.length));
    por({data:dia,titulo:r.titulo+' — '+ETAPAS_REDACAO[i],
      detalhe:'Entrega em '+dataCurta(r.entregaEm)+'. Uma etapa por dia: nunca deixar tudo para o último dia.',
      cat:'redacao',materia:'redacao',minutos:c.redacao,
      assinatura:'redacao:'+r.id+':'+i,prioridade:PRIO.redacao,ref:r.id});
  });

  E.simulados.forEach(function(s){
    if(s.status==='realizado'||difDias(dia,s.data)!==0) return;
    por({data:dia,titulo:'Simulado — '+s.nome,
      detalhe:'Dia do simulado. Cronometrar e anotar o tempo gasto.',
      cat:'simulado',vestibular:s.vestibular,
      minutos:Math.max(60,Math.min(sobra(),s.tempoMin||240)),
      assinatura:'simulado:'+s.id,prioridade:PRIO.simulado,ref:s.id});
  });

  /* ---- camada 2: núcleo garantido ---- */
  var blocoMin = carga? c.blocoCarga : c.blocoEstudo;

  ctx.filaAulas.sort(function(a,b){
    return (materias.indexOf(a.materia)<0?1:0)-(materias.indexOf(b.materia)<0?1:0);
  });
  var cotaAulaDia=cotaAulas(dia), aulasHoje=0;
  var aula=(cotaAulaDia>0)?ctx.filaAulas.shift():null;

  var estudadas=[];
  var alvo=escolher(dia,ctx.uso,estudadas);

  var paraQuestoes=materias.slice();
  if(alvo && paraQuestoes.indexOf(alvo.id)<0) paraQuestoes.push(alvo.id);
  paraQuestoes=paraQuestoes.slice(0,4);

  ctx.filaListas.sort(function(a,b){
    var pa=materias.indexOf(a.materia)<0?1:0, pb=materias.indexOf(b.materia)<0?1:0;
    return pa-pb || String(a.prazo||'9999').localeCompare(String(b.prazo||'9999'));
  });
  var cotaListaDia=cotaListas(dia), listasHoje=0;
  var lista=(cotaListaDia>0)?ctx.filaListas.shift():null;

  /* Cota de provas antigas do dia. Com 0 em dias úteis, elas ficam só no fim de
     semana; o bloco do núcleo só é reservado se o dia tiver cota. */
  var fimDeSemana = (diaSemana(dia)===0||diaSemana(dia)===6);
  var alvoBlocos = cotaPA(dia);   /* uma cota por dia da semana */

  /* Os blocos de prova antiga do dia são reservados ANTES de tudo o que é
     elástico — é isso que faz eles realmente acontecerem no fim de semana em
     vez de sobrarem para o fim da fila. Deixamos 40 min livres no mínimo para
     o estudo e as questões do dia. */
  /* A cota do dia é garantida: se o sábado pede todas as matérias, todas saem,
     mesmo que o dia fique cheio. O cartão do Planner mostra o total contra a
     sua disponibilidade para você enxergar quando não cabe. */
  var blocosPlanejados = alvoBlocos;
  var orc = sobra() - blocosPlanejados*c.provaAntiga;

  if(aula && orc >= c.aulaAtrasada+10){
    orc -= c.aulaAtrasada;
    por({data:dia,titulo:aula.titulo,
      detalhe:'Pendência acumulada de '+nomeDisc(aula.materia)+'. Prioridade permanente enquanto houver fila.',
      cat:'aula_atrasada',materia:aula.materia,minutos:c.aulaAtrasada,
      assinatura:'aula_atrasada:'+aula.id,prioridade:PRIO.aulaAtrasada,ref:aula.id});
    aulasHoje++;
  } else if(aula){ ctx.filaAulas.unshift(aula); }

  var reservaQ=Math.max(10,Math.min(paraQuestoes.length,2)*10);
  if(alvo && orc-reservaQ>=30){
    var m=arred5(Math.min(blocoMin,orc-reservaQ),30);
    orc-=m;
    estudadas.push(alvo.id);
    ctx.uso[alvo.id]=(ctx.uso[alvo.id]||0)+1;
    var pend=alvo.topicos.filter(function(t){return t.status!=='dominado';});
    var foco=null;
    for(var i=0;i<pend.length;i++){ if(pend[i].alta){ foco=pend[i]; break; } }
    if(!foco) foco=pend[0];
    /* se a matéria tem dificuldade declarada, o bloco aponta direto para ela */
    var difMat=dificuldadesAtivas(alvo.id);
    var detalheBloco = difMat.length
      ? 'Foco na sua dificuldade: '+difMat[Math.abs(difDias('2026-01-01',dia))%difMat.length].titulo+'.'
      : (foco? 'Foco: '+foco.nome+(foco.alta?' (muito cobrado pela UFSC)':'')+'.'
             : 'Conteúdo em dia — usar para aprofundar.');
    por({data:dia,titulo:(carga?'Estudo para provas':'Bloco')+' — '+alvo.nome,
      detalhe: detalheBloco,
      cat:carga?'revisao_intensiva':'estudo',materia:alvo.id,minutos:m,
      assinatura:'estudo:'+alvo.id+':'+dia,prioridade:PRIO.estudo});
  }

  var blocosPA=0, gruposDoDia={};
  function blocoProvaAntiga(){
    var g=proximoGrupoPA(dia,ctx);
    /* trava dura: se a volta trouxer um grupo que já saiu hoje, pula para o próximo */
    var tentativas=0;
    while(g && gruposDoDia[g.id] && tentativas<gruposPA().length){
      g=proximoGrupoPA(dia,ctx); tentativas++;
    }
    if(g) gruposDoDia[g.id]=1;
    if(!g){
      por({data:dia,titulo:'Prova antiga '+principal.nome,
        detalhe:'Bloco cronometrado de '+c.provaAntiga+' min.',
        cat:'prova_antiga',vestibular:principal.id,minutos:c.provaAntiga,
        assinatura:'prova_antiga:'+principal.id+':'+dia,prioridade:PRIO.provaAntiga});
      blocosPA++;
      return;
    }
    var mid=materiaDoGrupo(g,dia,ctx);
    var d=mid?disciplina(mid):null;
    if(mid) ctx.usoPA[mid]=(ctx.usoPA[mid]||0)+1;
    var varias=(g.materias||[]).length>1;
    por({data:dia,titulo:'Prova antiga '+principal.nome+' — '+g.nome,
      detalhe:(varias&&d ? 'Foque em '+d.nome+' nesta rodada. ' : '')+
        'Bloco de '+c.provaAntiga+' min cronometrados'+
        (d&&d.exata?' — reforço de exatas.':'.'),
      cat:'prova_antiga',materia:mid||undefined,vestibular:principal.id,minutos:c.provaAntiga,
      assinatura:'prova_antiga:'+principal.id+':'+g.id+':'+dia+':'+blocosPA,
      prioridade:PRIO.provaAntiga});
    blocosPA++;
  }
  for(var bp=0;bp<blocosPlanejados;bp++) blocoProvaAntiga();

  paraQuestoes.forEach(function(mid){
    if(orc<10) return;
    var chave='questoes:'+mid+':'+dia;
    var qtd=faixaEstavel(chave,c.questoesMin,c.questoesMax);
    var mins=arred5(Math.min(faixaEstavel(chave+':m',c.questoesMinMin,c.questoesMinMax),orc),10);
    orc-=mins;
    por({data:dia,titulo:'Questões — '+nomeDisc(mid),
      detalhe:qtd+' questões do módulo estudado ('+mins+' min).',
      cat:'questoes',materia:mid,minutos:mins,
      assinatura:'questoes:'+mid+':'+dia,prioridade:PRIO.questoes});
  });
  if(!paraQuestoes.length && orc>=15){
    var mg=arred5(Math.min(30,orc),15); orc-=mg;
    por({data:dia,titulo:'Questões do dia',detalhe:'Misturar matérias.',
      cat:'questoes',minutos:mg,assinatura:'questoes_geral:'+dia,prioridade:PRIO.questoes});
  }

  if(lista && orc>=15){
    var ml=arred5(Math.min(c.listas,orc),15); orc-=ml;
    por({data:dia,titulo:'Lista — '+lista.titulo,
      detalhe:nomeDisc(lista.materia)+' · '+lista.questoes+' questões'+(lista.prazo?' · prazo '+dataCurta(lista.prazo):''),
      cat:'lista',materia:lista.materia,minutos:ml,
      assinatura:'lista:'+lista.id,prioridade:PRIO.lista,ref:lista.id});
    listasHoje++;
  } else if(lista){ ctx.filaListas.unshift(lista); }

  /* ---- camada 3: extras ---- */
  E.vestibulares.forEach(function(v){
    if(!v.ativo||v.id===principal.id||!v.datas.length) return;
    var primeira=v.datas.slice().sort()[0], d=difDias(dia,primeira);
    if(d<0||d>c.janelaOutras||sobra()<c.provaAntiga) return;
    por({data:dia,titulo:'Prova antiga '+v.nome,
      detalhe:v.nome+' em '+dataCurta(primeira)+' — semana anterior à prova.',
      cat:'prova_antiga',vestibular:v.id,minutos:c.provaAntiga,
      assinatura:'prova_antiga_outras:'+v.id+':'+dia,prioridade:PRIO.provaOutras});
  });

  E.simulados.forEach(function(s){
    if(s.status==='realizado') return;
    if(c.simuladoFimDeSemana && !fimDeSemana) return;  /* treino de simulado no fim de semana */
    var d=difDias(dia,s.data);
    if(d<=0||d>c.semanasSimulado*7||sobra()<30) return;
    por({data:dia,titulo:'Preparação para o simulado — correção de erros',
      detalhe:s.nome+' em '+dataCurta(s.data)+' ('+d+' dias). Semana '+Math.ceil(d/7)+' de reforço.',
      cat:'simulado',vestibular:s.vestibular,minutos:30,
      assinatura:'simulado_prep:'+s.id+':'+dia,prioridade:PRIO.simulado+2,ref:s.id});
  });

  /* Volta do conteúdo em que ela foi mal: entra assim que chega a data marcada,
     antes dos blocos extras de prova antiga. Uma por dia. */
  if(ctx.filaRetomada && ctx.filaRetomada.length && sobra()>=c.retomadaMinutos){
    var ret=ctx.filaRetomada[0];
    if(ret.voltaEm<=dia){
      ctx.filaRetomada.shift();
      por({data:dia,titulo:'Retomar — '+ret.tema,
        detalhe:nomeDisc(ret.materia)+' · você ficou em '+ret.pct+'% aqui'+
          (ret.tentativas>1?' pela '+ret.tentativas+'ª vez':'')+
          '. Refazer questões desse conteúdo e revisar os erros.',
        cat:'retomada',materia:ret.materia,minutos:c.retomadaMinutos,
        assinatura:'retomada:'+ret.id,prioridade:PRIO.retomada,ref:ret.id});
    }
  }

  while(blocosPA<alvoBlocos && sobra()>=c.provaAntiga) blocoProvaAntiga();

  /* Reforço das maiores dificuldades: entra só com folga real (camada de extras),
     no máximo um por dia e algumas vezes por semana para cada dificuldade.
     Assim ela ganha foco sem tirar espaço do que já era obrigatório. */
  /* Aceita um reforço mais curto quando sobrou pouco: ele só usa o que restou,
     então encolher aqui aumenta a presença da dificuldade sem tirar nada de ninguém. */
  var difs=dificuldadesAtivas();
  var minReforco=Math.min(20,c.reforcoDificuldade);
  if(difs.length && sobra()>=minReforco){
    difs.sort(function(a,b){
      var ua=ctx.usoDif[a.id]||0, ub=ctx.usoDif[b.id]||0;
      if(ua!==ub) return ua-ub;
      return (b.nivel||1)-(a.nivel||1);
    });
    for(var di=0;di<difs.length;di++){
      var dif=difs[di];
      if((ctx.usoDif[dif.id]||0)>=c.reforcosPorSemana) continue;
      ctx.usoDif[dif.id]=(ctx.usoDif[dif.id]||0)+1;
      por({data:dia,titulo:'Reforço — '+dif.titulo,
        detalhe:nomeDisc(dif.materia)+' · uma das suas maiores dificuldades'+
          (dif.obs?' · '+dif.obs:''),
        cat:'reforco',materia:dif.materia,
        minutos:Math.max(minReforco,Math.min(c.reforcoDificuldade,sobra())),
        assinatura:'reforco:'+dif.id+':'+dia,prioridade:PRIO.reforco,ref:dif.id});
      break;
    }
  }


  var extras=0;
  while(sobra()>=blocoMin && extras<3){
    var d2=escolher(dia,ctx.uso,estudadas);
    if(!d2) break;
    estudadas.push(d2.id);
    ctx.uso[d2.id]=(ctx.uso[d2.id]||0)+1;
    var p2=d2.topicos.filter(function(t){return t.status!=='dominado';});
    var f2=null;
    for(var z=0;z<p2.length;z++){ if(p2[z].alta){ f2=p2[z]; break; } }
    if(!f2) f2=p2[0];
    por({data:dia,titulo:(carga?'Estudo para provas':'Bloco')+' — '+d2.nome,
      detalhe:f2? 'Foco: '+f2.nome+(f2.alta?' (muito cobrado pela UFSC)':'')+'.' : 'Conteúdo em dia — aprofundar.',
      cat:carga?'revisao_intensiva':'estudo',materia:d2.id,minutos:blocoMin,
      assinatura:'estudo:'+d2.id+':'+dia,prioridade:PRIO.estudo});
    extras++;
  }

  while(ctx.filaAulas.length && sobra()>=c.aulaAtrasada && aulasHoje<cotaAulaDia){
    var ax=ctx.filaAulas.shift();
    aulasHoje++;
    por({data:dia,titulo:ax.titulo,
      detalhe:'Pendência acumulada de '+nomeDisc(ax.materia)+'. Prioridade permanente enquanto houver fila.',
      cat:'aula_atrasada',materia:ax.materia,minutos:c.aulaAtrasada,
      assinatura:'aula_atrasada:'+ax.id,prioridade:PRIO.aulaAtrasada,ref:ax.id});
  }
  while(ctx.filaListas.length && sobra()>=c.listas && listasHoje<cotaListaDia){
    var lx=ctx.filaListas.shift();
    listasHoje++;
    por({data:dia,titulo:'Lista — '+lx.titulo,
      detalhe:nomeDisc(lx.materia)+' · '+lx.questoes+' questões',
      cat:'lista',materia:lx.materia,minutos:c.listas,
      assinatura:'lista:'+lx.id,prioridade:PRIO.lista,ref:lx.id});
  }

  /* Obras entram em duas frentes independentes: leitura e exercícios.
     Cada uma roda entre as obras que ainda têm aquilo pendente, para as duas
     avançarem juntas em vez de a leitura terminar antes dos exercícios. */
  var giro=Math.abs(difDias('2026-01-01',dia));
  var obrasLeitura=E.obras.filter(function(o){ return o.lidas<o.paginas; });
  if(obrasLeitura.length && sobra()>=15){
    var ol=obrasLeitura[giro%obrasLeitura.length];
    var faltamPag=Math.max(0,ol.paginas-ol.lidas);
    por({data:dia,titulo:'Leitura — '+ol.titulo,
      detalhe:ol.autor+' · faltam '+faltamPag+' páginas'+(ol.prazo?' · prazo '+dataCurta(ol.prazo):''),
      cat:'obra',materia:'literatura',minutos:Math.min(c.obra,Math.max(15,sobra())),
      assinatura:'obra:'+ol.id+':'+dia,prioridade:PRIO.obra,ref:ol.id});
  }
  var obrasEx=E.obras.filter(function(o){ return o.exFeitos<o.exTotal; });
  if(obrasEx.length && sobra()>=15){
    var oe=obrasEx[giro%obrasEx.length];
    var faltamEx=Math.max(0,oe.exTotal-oe.exFeitos);
    por({data:dia,titulo:'Exercícios — '+oe.titulo,
      detalhe:'Faltam '+faltamEx+' exercícios da obra'+(oe.prazo?' · prazo '+dataCurta(oe.prazo):''),
      cat:'obra',materia:'literatura',minutos:Math.min(c.obraEx,Math.max(15,sobra())),
      assinatura:'obra_ex:'+oe.id+':'+dia,prioridade:PRIO.obra+1,ref:oe.id});
  }

  fora.sort(function(a,b){return a.prioridade-b.prioridade;});
  return fora;
}

function regenerar(inicio,dias){
  inicio=inicio||inicioSemana(hojeISO()); dias=dias||14;
  var fim=somaDias(inicio,dias-1);

  /* pendência com tarefa aberta fora da janela sai da fila,
     para não ocupar capacidade duas vezes */
  var agendadas={};
  E.tarefas.forEach(function(t){
    if(t.feita||!t.ref) return;
    if(t.data>=inicio&&t.data<=fim) return;
    agendadas[t.ref]=1;
  });

  var ctx={
    filaAulas:E.aulas.filter(function(a){return a.status==='aberta'&&!agendadas[a.id];}),
    filaListas:E.listas.filter(function(l){return l.status==='pendente'&&!agendadas[l.id];}),
    uso:{}, usoPA:{}, usoDif:{}, cicloPA:[], posPA:0, ultimoPA:null,
    filaRetomada:retomadasPendentes().filter(function(r){ return !agendadas[r.id]; })
  };

  var rascunhos=[];
  for(var i=0;i<dias;i++){
    rascunhos=rascunhos.concat(montarDia(somaDias(inicio,i),ctx));
    /* o rodízio de provas antigas (cicloPA/posPA) segue de onde parou de propósito:
       é ele que garante não repetir matéria antes de fechar a volta */
    if((i+1)%7===0){ ctx.uso={}; ctx.usoDif={}; }
  }

  function dentro(t){ return t.data>=inicio&&t.data<=fim; }
  var preservar=E.tarefas.filter(function(t){ return !dentro(t)||t.feita||t.travada||t.manual; });
  var porAssinatura={}, preservadas={};
  E.tarefas.forEach(function(t){ if(dentro(t)) porAssinatura[t.assinatura]=t; });
  preservar.forEach(function(t){ if(dentro(t)) preservadas[t.assinatura]=1; });

  var novas=[];
  var removidas={};
  (E.removidas||[]).forEach(function(a){ removidas[a]=1; });
  rascunhos.forEach(function(r){
    /* tarefa automática que ela apagou de propósito não volta no recálculo */
    if(removidas[r.assinatura]) return;
    if(preservadas[r.assinatura]) return;
    var ex=porAssinatura[r.assinatura];
    if(ex){
      for(var k in r) ex[k]=r[k];
      novas.push(ex);
    } else {
      r.id=id('t'); r.feita=false; novas.push(r);
    }
  });

  E.tarefas=preservar.concat(novas).sort(function(a,b){
    return a.data.localeCompare(b.data)||a.prioridade-b.prioridade;
  });

  /* Tira do lugar errado o que sobrou de configurações antigas ou de remanejos:
     prova antiga em dia sem cota, treino de simulado fora do fim de semana. */
  var contagemPA={}, vistosPA={};
  E.tarefas.forEach(function(t){
    if(t.cat!=='prova_antiga'||!t.feita) return;
    contagemPA[t.data]=(contagemPA[t.data]||0)+1;
    vistosPA[t.data+'|'+grupoDaTarefa(t)]=1;
  });
  E.tarefas=E.tarefas.filter(function(t){
    if(t.feita||t.manual) return true;
    if(t.cat==='prova_antiga'){
      var chave=t.data+'|'+grupoDaTarefa(t);
      if(vistosPA[chave]) return false;
      var n=contagemPA[t.data]||0;
      if(!podeNoDia(t,t.data,n)) return false;
      contagemPA[t.data]=n+1;
      vistosPA[chave]=1;
      return true;
    }
    return podeNoDia(t,t.data);
  });

  tirarRepetidasDoDia();

  salvar();
}

function porQue(t){
  var principal=vestibularPrincipal();
  switch(t.cat){
    case 'revisao_prova': return 'Prova escolar chegando — revisão reservada nos dias anteriores.';
    case 'redacao': return 'Redação com entrega marcada, dividida em etapas para não acumular.';
    case 'aula_perdida': return 'Aula que você perde nesse dia — recuperação automática no mesmo dia.';
    case 'aula_atrasada': return 'Pendência acumulada: prioridade permanente enquanto houver fila.';
    case 'simulado': return 'Simulado próximo — carga aumentada nas semanas anteriores.';
    case 'prova_antiga':
      return t.vestibular===principal.id
        ? principal.nome+' é prioridade máxima: bloco de prova antiga todos os dias.'
        : 'Semana anterior à prova desse vestibular.';
    case 'retomada': return 'Você ficou abaixo de '+(E.config.limiarRetomada||75)+'% nesse conteúdo — ele voltou para você.';
    case 'reforco': return 'Você marcou isso como uma das suas maiores dificuldades.';
    case 'anki': return 'Rotina diária fixa.';
    case 'questoes':
      var ap=aproveitamento(t.materia);
      return (ap!==null&&ap<E.config.limiarAproveitamento)
        ? 'Aproveitamento em '+Math.round(ap)+'% — precisa de mais questões.'
        : 'Questões do módulo estudado hoje.';
    case 'lista': return 'Lista pendente na fila.';
    case 'obra': return 'Obra literária cobrada — leitura distribuída ao longo dos dias.';
    case 'revisao_intensiva': return 'Dia de carga maior no seu planejamento.';
    case 'estudo':
      var d=disciplina(t.materia);
      if(dificuldadesAtivas(t.materia).length) return 'Matéria que você marcou como dificuldade.';
      if(d&&d.exata) return 'Exatas com reforço permanente no seu perfil.';
      if(materiasDoDia(t.data).indexOf(t.materia)>=0) return 'Casa com as aulas de hoje na escola.';
      return 'Conteúdo com menos progresso acumulado.';
  }
  return 'Faz parte do planejamento do dia.';
}

function alertas(){
  var hoje=hojeISO(), fora=[], c=E.config;
  var ab=aulasAbertas();
  if(ab) fora.push({n:ab>6?'cr':'at',t:ab+' aula(s) atrasada(s)',
    d:'Enquanto houver fila, elas têm prioridade permanente no planejamento.'});
  var atr=E.listas.filter(function(l){return l.status==='pendente'&&l.prazo&&l.prazo<hoje;});
  if(atr.length) fora.push({n:'cr',t:atr.length+' lista(s) com prazo vencido',
    d:atr.map(function(l){return l.titulo;}).join(', ')});
  E.redacoes.forEach(function(r){
    if(r.status==='entregue') return;
    var d=difDias(hoje,r.entregaEm);
    if(d<0) fora.push({n:'cr',t:r.titulo+' — entrega vencida',d:'Era para '+dataCurta(r.entregaEm)+'.'});
    else if(d<=2) fora.push({n:'at',t:r.titulo+' — entrega em '+(d===0?'hoje':d+' dia(s)'),d:'Prazo: '+dataCurta(r.entregaEm)+'.'});
  });
  var sa=E.simulados.filter(function(s){return s.status==='agendado'&&s.data<hoje;});
  if(sa.length) fora.push({n:'at',t:sa.length+' simulado(s) sem registro',
    d:'Registre a nota e a correção para o app acompanhar sua evolução.'});
  var oa=E.obras.filter(function(o){return o.prazo&&o.prazo<hoje&&o.lidas<o.paginas;});
  if(oa.length) fora.push({n:'at',t:oa.length+' obra(s) literária(s) atrasada(s)',
    d:oa.map(function(o){return o.titulo;}).join(', ')});
  E.vestibulares.forEach(function(v){
    if(!v.ativo||v.realizado) return;
    if(v.inscricaoDe && v.inscricaoDe<=hoje && !v.inscrito && (!v.inscricao||v.inscricao>=hoje)){
      fora.push({n:'at',t:'Inscrição da '+v.nome+' está aberta',
        d:'Abriu em '+dataCurta(v.inscricaoDe)+
          (v.inscricao?' e encerra em '+dataCurta(v.inscricao):'')+'. Ainda não está marcada como feita.'});
    }
    if(v.inscricao){
      var d=difDias(hoje,v.inscricao);
      if(d>=0&&d<=14&&!v.inscrito) fora.push({n:d<=5?'cr':'at',
        t:'Inscrição da '+v.nome+' encerra em '+d+' dia(s)',
        d:'Prazo final: '+dataCurta(v.inscricao)+'.'});
      if(d<0&&!v.inscrito) fora.push({n:'cr',t:'Inscrição da '+v.nome+' encerrou',
        d:'O prazo era '+dataCurta(v.inscricao)+' e ela não está marcada como feita.'});
    }
    if(v.inscrito&&!v.pago) fora.push({n:'at',t:'Pagamento da '+v.nome+' pendente',
      d:'Você marcou a inscrição como feita, mas não o pagamento'+(v.taxa?' ('+v.taxa+')':'')+'.'});
    var ultima=v.datas.slice().sort().pop();
    if(ultima&&ultima<hoje) fora.push({n:'inf',t:v.nome+' já passou',
      d:'A prova foi em '+dataCurta(ultima)+'. Marque como prestada na aba Vestibulares.'});
  });
  var criticas=E.disciplinas.filter(function(d){
    var ap=aproveitamento(d.id);
    var tot=soma(E.questoes.filter(function(q){return q.materia===d.id;}),function(q){return q.total;});
    return ap!==null&&ap<c.limiarAproveitamento&&tot>=20;
  });
  if(criticas.length) fora.push({n:'at',
    t:'Aproveitamento baixo em '+criticas.map(function(d){return d.nome;}).join(', '),
    d:'Abaixo de '+c.limiarAproveitamento+'%. Essas matérias já subiram na fila automaticamente.'});
  var duv=(E.duvidas||[]).filter(function(d){ return d.status==='pendente'; });
  if(duv.length>=3){
    var porM={};
    duv.forEach(function(d){ porM[d.materia]=(porM[d.materia]||0)+1; });
    fora.push({n:'inf',t:duv.length+' dúvidas esperando monitoria',
      d:Object.keys(porM).map(function(m){ return nomeDisc(m)+' ('+porM[m]+')'; }).join(', ')+'.'});
  }

  var retDisp=retomadasPendentes().filter(function(r){ return r.voltaEm<=hoje; });
  if(retDisp.length) fora.push({n:'at',t:retDisp.length+' conteúdo(s) para retomar',
    d:retDisp.slice(0,3).map(function(r){ return r.tema+' ('+r.pct+'%)'; }).join(', ')+
      '. Já entraram no planner.'});

  var prox=vestibularesOrdenados()[0];
  if(prox&&prox.dias>=0&&prox.dias<=30) fora.push({n:prox.dias<=7?'cr':'inf',
    t:prox.v.nome+' em '+prox.dias+' dia(s)',
    d:prox.dias<=7?'Semana da prova: provas antigas dessa banca entraram no planejamento.'
                  :'Prova em '+dataCurta(prox.data)+'.'});
  var ordem={cr:0,at:1,inf:2};
  return fora.sort(function(a,b){return ordem[a.n]-ordem[b.n];});
}

function alternarTarefa(idt){
  var t=null;
  for(var i=0;i<E.tarefas.length;i++) if(E.tarefas[i].id===idt) t=E.tarefas[i];
  if(!t) return;
  t.feita=!t.feita;
  if(t.feita){
    t.feitaEm=new Date().toISOString();
    /* o aviso da redistribuição automática some sozinho assim que ela começa
       a trabalhar — sem precisar clicar em "Está bom" */
    if(E.autoRedistribuicao && E.autoRedistribuicao.movidas && E.autoRedistribuicao.movidas.length){
      E.autoRedistribuicao.movidas=[];
    }
    E.sessoes.push({id:id('s'),data:t.data,materia:t.materia,minutos:t.minutos,cat:t.cat,titulo:t.titulo});
    if(t.cat==='aula_atrasada'&&t.ref) E.aulas.forEach(function(a){
      if(a.id===t.ref){ a.status='recuperada'; a.recuperada=t.data; } });
    if(t.cat==='lista'&&t.ref) E.listas.forEach(function(l){
      if(l.id===t.ref){ l.status='concluida'; l.concluida=t.data; l.tempo=(l.tempo||0)+t.minutos; } });
    if(t.cat==='redacao'&&t.ref) E.redacoes.forEach(function(r){
      if(r.id===t.ref){ if(r.status==='pendente') r.status='em_andamento';
        r.etapas=(r.etapas||0)+1; } });
    if(t.cat==='retomada'&&t.ref) (E.retomadas||[]).forEach(function(r){
      if(r.id===t.ref){ r.status='feita'; r.feitaEm=t.data; } });
  } else {
    E.sessoes=E.sessoes.filter(function(s){ return !(s.data===t.data&&s.titulo===t.titulo); });
    if(t.cat==='aula_atrasada'&&t.ref) E.aulas.forEach(function(a){
      if(a.id===t.ref){ a.status='aberta'; a.recuperada=null; } });
    if(t.cat==='lista'&&t.ref) E.listas.forEach(function(l){
      if(l.id===t.ref){ l.status='pendente'; l.concluida=null; } });
    if(t.cat==='retomada'&&t.ref) (E.retomadas||[]).forEach(function(r){
      if(r.id===t.ref){ r.status='pendente'; r.feitaEm=null; } });
  }
  salvar(); render();
}

function comando(qual){
  var hoje=hojeISO(), msg='';
  function proximoDia(){
    var c=somaDias(hoje,1);
    for(var i=0;i<14;i++){ if(capacidade(c)>0) return c; c=somaDias(c,1); }
    return somaDias(hoje,1);
  }
  if(qual==='terminei'){
    var n=0;
    E.tarefas.forEach(function(t){
      if(t.data===hoje&&!t.feita){
        t.feita=true; t.feitaEm=new Date().toISOString(); n++;
        E.sessoes.push({id:id('s'),data:hoje,materia:t.materia,minutos:t.minutos,cat:t.cat,titulo:t.titulo});
      }
    });
    msg='Tudo de hoje marcado como feito — '+n+' tarefa(s) registradas.';
  } else if(qual==='nao_consegui'||qual==='cansada'){
    var essenciais={anki:1,redacao:1,revisao_prova:1,simulado:1};
    /* cada tarefa vai para o dia que melhor a recebe, em vez de empilhar tudo amanhã */
    var alvo=E.tarefas.filter(function(t){
      return t.data===hoje && !t.feita && !(qual==='cansada'&&essenciais[t.cat]);
    });
    var destinos={}, m=0;
    alvo.forEach(function(t){
      var d=melhorDiaPara(t,hoje);
      moverTarefa(t,d);
      destinos[d]=(destinos[d]||0)+1;
      m++;
    });
    var listaDestinos=Object.keys(destinos).sort().map(function(d){
      return dataCurta(d)+(destinos[d]>1?' ('+destinos[d]+')':'');
    }).join(', ');
    msg = qual==='cansada'
      ? 'Dia reduzido ao essencial. '+m+' tarefa(s) foram para '+(listaDestinos||'os próximos dias')+'.'
      : m+' tarefa(s) remarcadas para '+(listaDestinos||'os próximos dias')+'. Nada foi perdido.';
    E.tarefas.sort(function(a,b){ return a.data.localeCompare(b.data)||a.prioridade-b.prioridade; });
  } else if(qual==='mais_tempo'){
    var extra=90, usados=0, p=0;
    E.tarefas.filter(function(t){return t.data>hoje&&!t.feita;})
      .sort(function(a,b){return a.data.localeCompare(b.data)||a.prioridade-b.prioridade;})
      .forEach(function(t){
        if(usados+t.minutos>extra) return;
        t.data=hoje; t.assinatura=t.assinatura+'@'+hoje; t.travada=true;
        usados+=t.minutos; p++;
      });
    msg=p+' tarefa(s) adiantadas para hoje ('+usados+' min a mais).';
  }
  E.comandos.unshift({id:id('c'),data:new Date().toISOString(),comando:qual,resultado:msg});
  E.comandos=E.comandos.slice(0,60);
  salvar(); render(); flutuante(msg);
}

function flutuante(msg){
  var el=document.getElementById('aviso-flutuante');
  el.textContent=msg; el.className='on';
  setTimeout(function(){ el.className=''; },3200);
}

    '<button class="btn primario" data-acao="nova-dificuldade">Nova dificuldade</button>');

  h+='<div class="grade g4">'+
     numero('Ativas',ativas.length,'',true)+
     numero('Reforços na semana',reforcosSemana.length,
       reforcosSemana.filter(function(t){return t.feita;}).length+' já feitos')+
     numero('Resolvidas',resolvidas.length)+
     numero('Nível mais alto',ativas.length?Math.max.apply(null,ativas.map(function(x){return x.nivel||1;})):'—',
       'de 3')+'</div>';

  h+='<div class="cartao" style="margin-top:16px"><h2>Como isso muda a sua semana</h2>'+
     '<p style="font-size:12px;color:var(--muted);margin-top:-6px;line-height:1.6">'+
     'A matéria da dificuldade sobe na fila do bloco de estudo e das provas antigas — quanto maior o nível, mais ela sobe. '+
     'O bloco daquela matéria passa a apontar direto para o assunto que você marcou. '+
     'E, <b>só quando sobra tempo no dia</b>, entra uma tarefa "Reforço" de '+E.config.reforcoDificuldade+
     ' min, no máximo uma por dia e '+E.config.reforcosPorSemana+'× por semana para cada dificuldade. '+
     'Anki, aulas atrasadas, redação, prova antiga e questões continuam intocados.</p>'+
     '<button class="btn mini" data-acao="recalcular">Recalcular a semana</button></div>';

  if(!ativas.length && !resolvidas.length){
    h+='<div class="cartao">'+vazio('Nenhuma dificuldade cadastrada ainda. Comece pelo assunto que mais te trava.')+'</div>';
  }

  if(ativas.length){
    h+='<div class="cartao"><h2>Em foco agora</h2><ul class="lista">';
    ativas.slice().sort(function(a,b){ return (b.nivel||1)-(a.nivel||1); }).forEach(function(x){
      var feitosSem=reforcosSemana.filter(function(t){ return t.ref===x.id; }).length;
      var rotulo=['','Incomoda','Difícil','Trava tudo'][x.nivel||1];
      h+='<li><span style="width:9px;height:9px;border-radius:99px;margin-top:7px;background:'+
         corDisc(x.materia)+'"></span>'+
         '<div class="tarefa"><div class="t">'+esc(x.titulo)+' '+
           selo(nomeDisc(x.materia),'',corDisc(x.materia))+' '+
           selo(rotulo,(x.nivel||1)>=3?'vermelho':((x.nivel||1)===2?'ambar':''))+'</div>'+
           '<div class="d">'+(x.obs?esc(x.obs)+' · ':'')+feitosSem+' reforço(s) nesta semana</div></div>'+
         '<button class="btn mini" data-acao="edit-dificuldade" data-id="'+x.id+'">editar</button>'+
         '<button class="btn mini" data-acao="resolver-dificuldade" data-id="'+x.id+'">resolvida</button>'+
         '<button class="btn mini perigo" data-acao="del-dificuldade" data-id="'+x.id+'">×</button></li>';
    });
    h+='</ul></div>';
  }

  /* sugestões a partir do aproveitamento real em questões */
  var sugestoes=E.disciplinas.map(function(d){
    var qs=E.questoes.filter(function(q){ return q.materia===d.id; });
    var tot=soma(qs,function(q){ return q.total; });
    var ap=tot? soma(qs,function(q){return q.acertos;})/tot*100 : null;
    return {d:d,ap:ap,tot:tot};
  }).filter(function(x){
    return x.tot>=10 && x.ap!==null && x.ap<E.config.limiarAproveitamento &&
      !dificuldadesAtivas(x.d.id).length;
  }).sort(function(a,b){ return a.ap-b.ap; });

  if(sugestoes.length){
    h+='<div class="cartao"><h2>O app sugere</h2>'+
       '<p style="font-size:12px;color:var(--muted);margin-top:-6px">Pelos seus registros de questões, estas matérias estão abaixo de '+
       E.config.limiarAproveitamento+'% e ainda não estão na lista.</p><ul class="lista">';
    sugestoes.forEach(function(x){
      h+='<li><div class="tarefa"><div class="t">'+esc(x.d.nome)+' '+
         selo(Math.round(x.ap)+'% de acerto','vermelho')+'</div>'+
         '<div class="d">'+x.tot+' questões registradas</div></div>'+
         '<button class="btn mini suave" data-acao="add-sugestao" data-id="'+x.d.id+'">adicionar</button></li>';
    });
    h+='</ul></div>';
  }

  if(resolvidas.length){
    h+='<div class="cartao"><h2>Já resolvidas</h2><ul class="lista">';
    resolvidas.forEach(function(x){
      h+='<li><span class="caixa marcada">✓</span>'+
         '<div class="tarefa"><div class="t" style="text-decoration:line-through;opacity:.6">'+esc(x.titulo)+'</div>'+
         '<div class="d">'+esc(nomeDisc(x.materia))+'</div></div>'+
         '<button class="btn mini" data-acao="resolver-dificuldade" data-id="'+x.id+'">reabrir</button>'+
         '<button class="btn mini perigo" data-acao="del-dificuldade" data-id="'+x.id+'">×</button></li>';
    });
    h+='</ul></div>';
  }

  return h;
};

PAGINAS.questoes=function(){
  var hoje=hojeISO(), semIni=inicioSemana(hoje);
  function ap(l){ var t=soma(l,function(q){return q.total;});
    return t? Math.round(soma(l,function(q){return q.acertos;})/t*100) : null; }
  var noDia=E.questoes.filter(function(q){return q.data===hoje;});
  var naSem=E.questoes.filter(function(q){return q.data>=semIni;});
  var h=cabecalho('Questões','Registro diário e aproveitamento por disciplina.',
    '<button class="btn primario" data-acao="nova-questao">Registrar questões</button>');
  h+='<div class="grade g4">'+
     numero('Hoje',soma(noDia,function(q){return q.total;}),ap(noDia)===null?'sem registro':ap(noDia)+'% de acerto',true)+
     numero('Na semana',soma(naSem,function(q){return q.total;}),ap(naSem)===null?'—':ap(naSem)+'% de acerto')+
     numero('Total',soma(E.questoes,function(q){return q.total;}),ap(E.questoes)===null?'—':ap(E.questoes)+'% geral')+
     numero('Registros',E.questoes.length)+'</div>';

  h+='<div class="cartao" style="margin-top:16px"><h2>Aproveitamento por disciplina</h2>';
  var linhas=E.disciplinas.map(function(d){
    var qs=E.questoes.filter(function(q){return q.materia===d.id;});
    var t=soma(qs,function(q){return q.total;});
    return {d:d,total:t,pc:t?Math.round(soma(qs,function(q){return q.acertos;})/t*100):0};
  }).filter(function(x){return x.total>0;}).sort(function(a,b){return a.pc-b.pc;});
  if(!linhas.length) h+=vazio('Registre questões para ver seu aproveitamento por matéria.');
  linhas.forEach(function(x){
    h+='<div style="display:flex;align-items:center;gap:10px;margin-bottom:8px">'+
       '<span style="width:100px;font-size:12px;color:var(--muted)">'+esc(x.d.nome)+'</span>'+
       '<div style="flex:1"><div class="barra fina"><i style="width:'+x.pc+'%;background:'+x.d.cor+'"></i></div></div>'+
       '<b style="width:44px;text-align:right;font-size:12px">'+x.pc+'%</b></div>';
  });
  h+='</div>';

  var pend=retomadasPendentes();
  var feitas=(E.retomadas||[]).filter(function(r){ return r.status==='feita'; });
  h+='<div class="cartao"><h2>Vai voltar para você</h2>'+
     '<p style="font-size:12px;color:var(--muted);margin:-6px 0 10px">'+
     'Todo conteúdo em que você fica abaixo de '+(E.config.limiarRetomada||75)+
     '% entra aqui e reaparece no planner '+(E.config.diasRetomada||10)+' dias depois, '+
     'como uma tarefa "Retomar". Não é revisão espaçada: é uma volta só, e ela só se repete '+
     'se você ficar abaixo do limite de novo.</p>';
  if(!pend.length && !feitas.length){
    h+=vazio('Nada na fila. Registre questões e o app cuida disso sozinho.');
  } else if(pend.length){
    h+='<ul class="lista">';
    pend.forEach(function(r){
      var dias=difDias(hojeISO(),r.voltaEm);
      h+='<li><span style="width:9px;height:9px;border-radius:99px;margin-top:7px;background:'+
         corDisc(r.materia)+'"></span>'+
         '<div class="tarefa"><div class="t">'+esc(r.tema)+' '+
           selo(nomeDisc(r.materia),'',corDisc(r.materia))+' '+
           selo(r.pct+'%',r.pct<50?'vermelho':'ambar')+
           (r.tentativas>1?' '+selo(r.tentativas+'ª vez','vermelho'):'')+'</div>'+
           '<div class="d">'+(dias>0?'volta em '+dias+' dia(s) · '+dataCurta(r.voltaEm)
                                    :'já disponível no planner')+'</div></div>'+
         '<button class="btn mini" data-acao="retomar-agora" data-id="'+r.id+'">agora</button>'+
         '<button class="btn mini" data-acao="adiar-retomada" data-id="'+r.id+'">+7d</button>'+
         '<button class="btn mini perigo" data-acao="del-retomada" data-id="'+r.id+'">×</button></li>';
    });
    h+='</ul>';
  }
  if(feitas.length){
    h+='<p style="font-size:11px;color:var(--muted);margin-top:10px">'+feitas.length+
       ' conteúdo(s) já retomado(s).</p>';
  }
  h+='</div>';

  h+='<div class="cartao"><h2>Últimos registros</h2>';
  if(!E.questoes.length) h+=vazio('Nenhuma questão registrada ainda.');
  else{
    h+='<table><tr><th>Data</th><th>Disciplina</th><th>Tema</th><th>Acertos</th><th>%</th><th></th></tr>';
    E.questoes.slice(0,25).forEach(function(q){
      var pc=q.total?Math.round(q.acertos/q.total*100):0;
      h+='<tr><td>'+dataCurta(q.data)+'</td><td>'+esc(nomeDisc(q.materia))+'</td>'+
         '<td>'+esc(q.tema||'—')+'</td><td>'+q.acertos+'/'+q.total+'</td>'+
         '<td>'+selo(pc+'%',pc>=70?'verde':(pc>=50?'ambar':'vermelho'))+'</td>'+
         '<td><button class="btn mini perigo" data-acao="del-questao" data-id="'+q.id+'">×</button></td></tr>';
    });
    h+='</table>';
  }
  h+='</div>';
  return h;
};

PAGINAS.duvidas=function(){
  E.duvidas=E.duvidas||[];
  var filtro=EstadoUI.filtroDuvida||'pendentes';
  var pendentes=E.duvidas.filter(function(d){ return d.status==='pendente'; });
  var resolvidas=E.duvidas.filter(function(d){ return d.status==='resolvida'; });
  var lista = filtro==='pendentes' ? pendentes : (filtro==='resolvidas' ? resolvidas : E.duvidas);

  var h=cabecalho('Monitorias',
    'Anote a dúvida na hora que ela aparece e chegue na monitoria sabendo exatamente o que perguntar.',
    '<button class="btn primario" data-acao="nova-duvida">Nova dúvida</button>');

  /* quantas dúvidas por matéria — é assim que ela decide qual monitoria procurar */
  var porMateria={};
  pendentes.forEach(function(d){ porMateria[d.materia]=(porMateria[d.materia]||0)+1; });
  var materias=Object.keys(porMateria).sort(function(a,b){ return porMateria[b]-porMateria[a]; });

  h+='<div class="grade g4">'+
     numero('Dúvidas em aberto',pendentes.length,'',true)+
     numero('Já resolvidas',resolvidas.length)+
     numero('Matérias envolvidas',materias.length)+
     numero('Mais dúvidas em',materias.length?nomeDisc(materias[0]):'—',
       materias.length?porMateria[materias[0]]+' em aberto':'')+'</div>';

  if(materias.length){
    h+='<div class="cartao" style="margin-top:16px"><h2>Para levar em cada monitoria</h2>'+
       '<div style="display:flex;flex-wrap:wrap;gap:6px">';
    materias.forEach(function(m){
      h+='<button class="selo" style="background:'+corDisc(m)+'22;color:'+corDisc(m)+
         '" data-acao="filtrar-duvida-materia" data-id="'+m+'">'+esc(nomeDisc(m))+' · '+porMateria[m]+'</button>';
    });
    if(EstadoUI.materiaDuvida){
      h+='<button class="selo" data-acao="filtrar-duvida-materia" data-id="">limpar filtro</button>';
    }
    h+='</div></div>';
  }

  h+='<div class="abas" style="margin-top:16px">'+
     [['pendentes','Em aberto ('+pendentes.length+')'],
      ['resolvidas','Resolvidas ('+resolvidas.length+')'],
      ['todas','Todas']].map(function(o){
       return '<button class="'+(filtro===o[0]?'on':'')+'" data-acao="filtro-duvida" data-f="'+o[0]+'">'+o[1]+'</button>';
     }).join('')+'</div>';

  if(EstadoUI.materiaDuvida) lista=lista.filter(function(d){ return d.materia===EstadoUI.materiaDuvida; });

  h+='<div class="cartao">';
  if(!lista.length){
    h+=vazio(filtro==='pendentes'
      ? 'Nenhuma dúvida anotada. Quando travar numa questão, registre aqui na hora.'
      : 'Nada por aqui.');
  } else {
    /* agrupadas por matéria e depois por lista, que é como a monitoria acontece */
    var grupos={};
    lista.forEach(function(d){
      var k=d.materia+'||'+(d.lista||'Sem origem anotada');
      (grupos[k]=grupos[k]||[]).push(d);
    });
    Object.keys(grupos).sort().forEach(function(k){
      var partes=k.split('||');
      h+='<div style="margin-bottom:14px">'+
         '<div style="display:flex;align-items:center;gap:8px;margin-bottom:6px">'+
         selo(nomeDisc(partes[0]),'',corDisc(partes[0]))+
         '<b style="font-size:13px">'+esc(partes[1])+'</b></div><ul class="lista">';
      grupos[k].forEach(function(d){
        h+='<li>'+
          '<button class="caixa'+(d.status==='resolvida'?' marcada':'')+'" data-acao="resolver-duvida" data-id="'+d.id+
            '" title="Marcar como resolvida">'+(d.status==='resolvida'?'✓':'')+'</button>'+
          '<div class="tarefa"><div class="t"'+(d.status==='resolvida'?' style="text-decoration:line-through;opacity:.6"':'')+'>'+
