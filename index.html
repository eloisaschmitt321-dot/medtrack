PAGINAS.vestibulares=function(){
  var principal=vestibularPrincipal(), hoje=hojeISO();
  var ativos=E.vestibulares.filter(function(v){ return v.ativo; });
  var inscritos=ativos.filter(function(v){ return v.inscrito; });
  var pagos=ativos.filter(function(v){ return v.pago; });
  var realizados=ativos.filter(function(v){ return v.realizado; });

  var h=cabecalho('Vestibulares',
    'Datas, inscrição, pagamento e o que você já prestou. A UFSC é a referência do planejamento.',
    '<button class="btn primario" data-acao="novo-vestibular">Novo vestibular</button>');

  h+='<div class="grade g4">'+
     numero('Inscrições feitas',inscritos.length+'/'+ativos.length,'',true)+
     numero('Pagamentos feitos',pagos.length+'/'+ativos.length,
       (inscritos.length-pagos.length)>0 ? (inscritos.length-pagos.length)+' inscrito(s) sem pagar' : 'em dia')+
     numero('Já prestados',realizados.length)+
     numero('Faltam prestar',ativos.length-realizados.length)+'</div>';

  /* pendências de inscrição em destaque */
  var pend=[];
  ativos.forEach(function(v){
    if(v.realizado) return;
    if(v.inscricao && v.inscricao<hoje && !v.inscrito)
      pend.push({v:v,txt:'inscrição encerrou em '+dataCurta(v.inscricao)+' e não está marcada como feita',n:'cr'});
    else if(v.inscricao && !v.inscrito)
      pend.push({v:v,txt:'inscrição aberta até '+dataCurta(v.inscricao)+' ('+difDias(hoje,v.inscricao)+' dias)',n:'at'});
    else if(v.inscrito && !v.pago)
      pend.push({v:v,txt:'inscrita, mas o pagamento ainda não foi marcado',n:'at'});
  });
  if(pend.length){
    h+='<div class="cartao" style="margin-top:16px;border-color:var(--amber)"><h2>Pendências de inscrição</h2><ul class="lista">';
    pend.forEach(function(x){
      h+='<li><span class="selo '+(x.n==='cr'?'vermelho':'ambar')+'">'+esc(x.v.nome)+'</span>'+
         '<span class="tarefa" style="font-size:13px">'+esc(x.txt)+'</span>'+
         '<button class="btn mini" data-acao="edit-vestibular" data-id="'+x.v.id+'">resolver</button></li>';
    });
    h+='</ul></div>';
  }

  h+='<div class="grade g2" style="margin-top:16px">';
  E.vestibulares.slice().sort(function(a,b){
    return (b.ativo?1:0)-(a.ativo?1:0)||a.prioridade-b.prioridade;
  }).forEach(function(v){
    var futuras=v.datas.slice().sort(), prox=null;
    for(var i=0;i<futuras.length;i++) if(futuras[i]>=hoje){ prox=futuras[i]; break; }
    if(!prox) prox=futuras[futuras.length-1];
    var d=prox?difDias(hoje,prox):0;

    h+='<div class="cartao"'+(v.ativo?'':' style="opacity:.55"')+'><h2>'+
       '<span style="display:inline-block;width:9px;height:9px;border-radius:99px;background:'+v.cor+';margin-right:6px"></span>'+
       esc(v.nome)+(v.id===principal.id?' '+selo('principal','rosa'):'')+
       (v.ativo?'':' '+selo('inativo'))+
       (v.realizado?' '+selo('já prestado','verde'):'')+'</h2>'+
       '<p style="font-size:12px;color:var(--muted);margin:-6px 0 10px">'+
       v.datas.map(dataBR).join(' e ')+' · prioridade '+v.prioridade+' · peso '+v.peso+'</p>';

    /* linha de situação — clicável */
    h+='<div style="display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px">'+
       '<button class="selo '+(v.inscrito?'verde':'')+'" data-acao="toggle-vest" data-id="'+v.id+
         '" data-campo="inscrito">'+(v.inscrito?'✓ inscrita':'inscrição pendente')+'</button>'+
       '<button class="selo '+(v.pago?'verde':(v.inscrito?'ambar':''))+'" data-acao="toggle-vest" data-id="'+v.id+
         '" data-campo="pago">'+(v.pago?'✓ paga':'pagamento pendente')+'</button>'+
       '<button class="selo '+(v.realizado?'verde':'')+'" data-acao="toggle-vest" data-id="'+v.id+
         '" data-campo="realizado">'+(v.realizado?'✓ prova feita':'prova não feita')+'</button>'+
       '</div>';

    if(v.inscricaoDe||v.inscricao){
      var janela='Inscrições'+(v.inscricaoDe?' de '+dataCurta(v.inscricaoDe):'')+
        (v.inscricao?' até '+dataCurta(v.inscricao):'');
      var estado='';
      if(v.inscricao){
        var dd=difDias(hoje,v.inscricao);
        estado = v.inscrito ? ' · já garantida'
          : (dd<0 ? ' · encerrada há '+Math.abs(dd)+' dia(s)' : ' · faltam '+dd+' dia(s)');
      }
      h+='<p style="font-size:12px;color:var(--muted);margin:0 0 10px">'+esc(janela+estado)+
         (v.taxa?' · taxa '+esc(v.taxa):'')+'</p>';
    }

    if(v.ativo&&d>=0&&!v.realizado){
      var wk=fimDeSemanaAte(prox);
      h+='<div class="dias">'+d+' <span style="font-size:12px;font-weight:400;color:var(--muted)">dias restantes</span></div>'+
         '<div style="margin-top:10px">'+barra(Math.max(2,100-Math.min(100,d/400*100)))+'</div>'+
         '<div class="grade g3" style="margin-top:10px;gap:8px">'+
         numero('sábados',wk.sab)+numero('domingos',wk.dom)+numero('horas',horasAteData(prox)+'h')+'</div>';
    }
    if(v.obs) h+='<p style="font-size:11px;color:var(--muted);margin-top:10px">'+esc(v.obs)+'</p>';
    h+='<div style="margin-top:10px">'+
       '<button class="btn mini" data-acao="edit-vestibular" data-id="'+v.id+'">Editar</button> '+
       '<button class="btn mini" data-acao="ativar" data-id="'+v.id+'">'+(v.ativo?'Desativar':'Ativar')+'</button> '+
       '<button class="btn mini perigo" data-acao="del-vestibular" data-id="'+v.id+'">Excluir</button>'+
       '</div></div>';
  });
  h+='</div>';
  return h;
};

PAGINAS.estatisticas=function(){
  var hoje=hojeISO();
  var porDia={};
  E.sessoes.forEach(function(s){ porDia[s.data]=(porDia[s.data]||0)+s.minutos; });
  var totalMin=soma(E.sessoes,function(s){return s.minutos;});
  var diasCom=0; for(var k in porDia) diasCom++;
  var qTot=soma(E.questoes,function(q){return q.total;});
  var qAc=soma(E.questoes,function(q){return q.acertos;});

  var h=cabecalho('Estatísticas','Tudo o que o app aprendeu sobre a sua preparação até agora.');
  h+='<div class="grade g4">'+
     numero('Horas totais',horas(totalMin),'',true)+
     numero('Média diária',horas(diasCom?Math.round(totalMin/diasCom):0),diasCom+' dias com registro')+
     numero('Questões',qTot,qTot?Math.round(qAc/qTot*100)+'% de acerto':'—')+
     numero('Dias consecutivos',sequencia(),'sequência atual')+'</div>';

  /* 30 dias */
  h+='<div class="cartao" style="margin-top:16px"><h2>Horas estudadas — 30 dias</h2>';
  var maxi=1;
  for(var i=0;i<30;i++){ var v=porDia[somaDias(hoje,i-29)]||0; if(v>maxi) maxi=v; }
  h+='<div style="display:flex;align-items:flex-end;gap:3px;height:130px">';
  for(var j=0;j<30;j++){
    var dia=somaDias(hoje,j-29), val=porDia[dia]||0;
    h+='<div title="'+dataCurta(dia)+': '+horas(val)+'" style="flex:1;background:var(--accent);opacity:'+
       (val?1:.15)+';height:'+Math.max(2,val/maxi*100)+'%;border-radius:4px 4px 0 0"></div>';
  }
  h+='</div></div>';

  /* consistência */
  h+='<div class="cartao"><h2>Consistência — últimas 18 semanas</h2><div class="colunas">';
  var inicio=somaDias(hoje,-125);
  inicio=somaDias(inicio,-diaSemana(inicio));
  for(var c=0;c<19;c++){
    h+='<div>';
    for(var d2=0;d2<7;d2++){
      var dd=somaDias(inicio,c*7+d2);
      if(dd>hoje){ h+='<i style="opacity:.25"></i>'; continue; }
      var vv=porDia[dd]||0;
      var op = vv? Math.min(1,.25+vv/240*.75) : 0;
      h+='<i title="'+dataCurta(dd)+': '+horas(vv)+'" style="'+
         (op? 'background:var(--accent);opacity:'+op : '')+'"></i>';
    }
    h+='</div>';
  }
  h+='</div></div>';

  /* rankings */
  h+='<div class="grade g2">';
  h+='<div class="cartao"><h2>Progresso por disciplina</h2>';
  E.disciplinas.slice().sort(function(a,b){return progressoDisc(b)-progressoDisc(a);}).forEach(function(d){
    h+='<div style="display:flex;align-items:center;gap:10px;margin-bottom:7px">'+
       '<span style="width:96px;font-size:12px;color:var(--muted)">'+esc(d.nome)+'</span>'+
       '<div style="flex:1"><div class="barra fina"><i style="width:'+progressoDisc(d)+'%;background:'+d.cor+'"></i></div></div>'+
       '<b style="width:38px;text-align:right;font-size:12px">'+progressoDisc(d)+'%</b></div>';
  });
  h+='</div>';

  h+='<div class="cartao"><h2>Horas por disciplina</h2>';
  var horasD=E.disciplinas.map(function(d){
    return {d:d,m:soma(E.sessoes.filter(function(s){return s.materia===d.id;}),function(s){return s.minutos;})};
  }).filter(function(x){return x.m>0;}).sort(function(a,b){return b.m-a.m;});
  if(!horasD.length) h+=vazio('Conclua tarefas no planner para ver as horas por matéria.');
  var maxH=horasD.length?horasD[0].m:1;
  horasD.forEach(function(x){
    h+='<div style="display:flex;align-items:center;gap:10px;margin-bottom:7px">'+
       '<span style="width:96px;font-size:12px;color:var(--muted)">'+esc(x.d.nome)+'</span>'+
       '<div style="flex:1"><div class="barra fina"><i style="width:'+(x.m/maxH*100)+'%;background:'+x.d.cor+'"></i></div></div>'+
       '<b style="width:44px;text-align:right;font-size:12px">'+horas(x.m)+'</b></div>';
  });
  h+='</div></div>';

  h+='<div class="cartao"><h2>Histórico recente</h2>';
  if(!E.sessoes.length) h+=vazio('Conclua tarefas no planner para o histórico aparecer aqui.');
  else{
    h+='<table><tr><th>Data</th><th>Tarefa</th><th>Disciplina</th><th>Tempo</th></tr>';
    E.sessoes.slice().reverse().slice(0,20).forEach(function(s){
      h+='<tr><td>'+dataCurta(s.data)+'</td><td>'+esc(s.titulo)+'</td>'+
         '<td>'+esc(s.materia?nomeDisc(s.materia):'—')+'</td><td>'+horas(s.minutos)+'</td></tr>';
    });
    h+='</table>';
  }
  h+='</div>';
  return h;
};

/* Rede de segurança: roda a cada tela desenhada e tira do lugar errado o que
   quer que tenha sobrado — de versão antiga, de remanejo, de tarefa fixada.
   Não depende de migração nem de recálculo: se está no dia errado, sai. */
/* ---------------------------------------------------------------------
   NADA REPETIDO NO MESMO DIA
   Duas tarefas são "a mesma" quando caem no mesmo dia, são da mesma
   categoria e apontam para a mesma coisa. Comparar pelo título sozinho
   seria errado: você tem duas aulas atrasadas de Física de verdade, e
   elas têm o mesmo nome — por isso, quando a tarefa vem de um item
   (aula, lista, redação, simulado), o que vale é o item (ref).
   --------------------------------------------------------------------- */
function chaveEm(t,dia){
  var base;
  if(t.ref) base='ref:'+t.ref;
  else if(t.cat==='prova_antiga') base='pa:'+grupoDaTarefa(t);
  else base='tit:'+String(t.titulo||'').trim().toLowerCase().replace(/\s+/g,' ');
  return dia+'|'+t.cat+'|'+base;
}
function chaveNoDia(t){ return chaveEm(t,t.data); }

/* qual das repetidas fica: a já concluída na frente de tudo, depois a que
   você criou ou fixou no dia, e só então a que o app gerou sozinho */
function pesoParaFicar(t){
  if(t.feita) return 3;
  if(t.manual||t.fixadaPorMim||t.travada) return 2;
  return 1;
}

function tirarRepetidasDoDia(){
  var melhor={}, ordem=[];
  E.tarefas.forEach(function(t,i){
    var k=chaveNoDia(t);
    if(melhor[k]===undefined){ melhor[k]=i; ordem.push(k); return; }
    if(pesoParaFicar(t)>pesoParaFicar(E.tarefas[melhor[k]])) melhor[k]=i;
  });
  if(ordem.length===E.tarefas.length) return false;
  var fica={};
  ordem.forEach(function(k){ fica[melhor[k]]=1; });
  E.tarefas=E.tarefas.filter(function(t,i){ return fica[i]; });
  return true;
}

/* já existe algo igual nesse dia? usado para avisar antes de duplicar */
function jaExisteNoDia(t,ignorarId){
  var k=chaveNoDia(t), achou=false;
  E.tarefas.forEach(function(x){
    if(ignorarId&&x.id===ignorarId) return;
    if(chaveNoDia(x)===k) achou=true;
  });
  return achou;
}

function sanear(){
  var mudou=false, contagem={}, vistos={};
  var novas=[];
  /* as concluídas entram primeiro na contagem, para nunca serem descartadas */
  E.tarefas.forEach(function(t){
    if(t.cat!=='prova_antiga'||!t.feita) return;
    contagem[t.data]=(contagem[t.data]||0)+1;
    vistos[t.data+'|'+grupoDaTarefa(t)]=1;
  });
  E.tarefas.forEach(function(t){
    if(t.feita){ novas.push(t); return; }
    if(t.manual){ novas.push(t); return; }
    if(t.cat==='prova_antiga'){
      var chave=t.data+'|'+grupoDaTarefa(t);
      if(vistos[chave]){ mudou=true; return; }            /* grupo repetido no dia */
      var n=contagem[t.data]||0;
      if(!podeNoDia(t,t.data,n)){ mudou=true; return; }   /* dia sem cota */
      contagem[t.data]=n+1;
      vistos[chave]=1;
      novas.push(t); return;
    }
    if(!podeNoDia(t,t.data)){ mudou=true; return; }
    novas.push(t);
  });
  if(mudou) E.tarefas=novas;
  if(tirarRepetidasDoDia()) mudou=true;
  if(mudou) salvar();
  return mudou;
}

function render(){
  /* se algo foi tirado do lugar errado, o planejamento é refeito na hora para
     os blocos reaparecerem no dia certo */
  if(sanear()) regenerar();
  redistribuirAutomatico();   /* guardada por dia: não repete no mesmo dia */
  aplicarTema();
  renderMenu();
  var f=PAGINAS[EstadoUI.pagina]||PAGINAS.painel;
  document.getElementById('conteudo').innerHTML=f();
  window.scrollTo(0,0);
}

/* Ao mudar ou excluir uma pendência, as tarefas ainda não feitas ligadas a ela
   saem do planner — senão sobraria uma tarefa órfã com o texto antigo.
   As já concluídas ficam, porque fazem parte do histórico. */
function limparTarefasDe(ref){
  E.tarefas=E.tarefas.filter(function(t){ return !(t.ref===ref && !t.feita); });
}

function editarAula(ida){
  var a=null;
  E.aulas.forEach(function(x){ if(x.id===ida) a=x; });
  if(!a) return;
  abrirModal('Editar aula',
    campo('Título','f-titulo','text',a.titulo)+
    campoSelect('Disciplina','f-materia',opcoesDisciplinas(),a.materia)+
    campoSelect('Tipo','f-tipo',[['atrasada','Atrasada'],['perdida','Perdida']],a.tipo)+
    campoSelect('Situação','f-status',[['aberta','Em aberto'],['recuperada','Recuperada']],a.status),
    function(){
      var padraoAntigo='Aula '+(a.tipo==='atrasada'?'atrasada':'perdida')+' de '+nomeDisc(a.materia);
      var titulo=val('f-titulo');
      a.materia=val('f-materia');
      a.tipo=val('f-tipo');
      /* se o título ainda era o automático, acompanha a nova matéria */
      a.titulo = (!titulo || titulo===padraoAntigo)
        ? 'Aula '+(a.tipo==='atrasada'?'atrasada':'perdida')+' de '+nomeDisc(a.materia)
        : titulo;
      var novoStatus=val('f-status');
      if(novoStatus!==a.status){
        a.status=novoStatus;
        a.recuperada = novoStatus==='recuperada' ? hojeISO() : null;
      }
      limparTarefasDe(a.id);
      salvar(); regenerar(); render(); flutuante('Aula atualizada.');

/* Formulário completo de tarefa: serve tanto para criar quanto para editar.
   `diaPadrao` é o dia do cartão em que ela clicou no +. */
function formTarefa(t,diaPadrao){
  t=t||{};
  var novo=!t.id;
  return campo('O que você precisa fazer?','f-titulo','text',t.titulo||'')+
    campo('Dia','f-data','date',t.data||diaPadrao||hojeISO())+
    campoSelect('Tipo','f-cat',OPCOES_CAT,t.cat||'pessoal')+
    campoSelect('Disciplina (opcional)','f-materia',
      [['','— nenhuma —']].concat(opcoesDisciplinas()),t.materia||'')+
    campo('Quanto tempo (minutos)','f-min','number',t.minutos||30)+
    campo('Horário (opcional)','f-hora','time',t.hora||'')+
    campoSelect('Onde entra no dia','f-prio',
      [['1','Logo no começo'],['15','No meio'],['40','Por último']],String(t.prioridade||15))+
    campo('Observação (opcional)','f-obs','textarea',t.detalhe||'')+
    (novo
      ? campoSelect('Repetir','f-rep',[['nao','Só nesse dia'],
          ['semanal','Toda semana, no mesmo dia'],['diario','Todos os dias']],'nao')+
        campo('Por quantas semanas (se repetir)','f-sem','number',4)
      : '');
}

function lerFormTarefa(){
  var titulo=val('f-titulo');
  if(!titulo){ alert('Escreva o que você precisa fazer.'); return null; }
  return {
    titulo:titulo,
    cat:val('f-cat'),
    materia:val('f-materia')||null,
    minutos:Math.max(5,parseInt(val('f-min'),10)||30),
    hora:val('f-hora')||null,
    prioridade:parseInt(val('f-prio'),10)||15,
    detalhe:val('f-obs')
  };
}

function novaTarefa(diaPadrao){
  abrirModal('Adicionar ao planner',formTarefa(null,diaPadrao),function(){
    var base=lerFormTarefa();
    if(!base) return false;
    var data=val('f-data')||hojeISO();
    var rep=val('f-rep')||'nao';
    var semanas=Math.max(1,parseInt(val('f-sem'),10)||1);
    var datas=[data];
    if(rep==='semanal'){ datas=[]; for(var i=0;i<semanas;i++) datas.push(somaDias(data,i*7)); }
    if(rep==='diario'){ datas=[]; for(var j=0;j<semanas*7;j++) datas.push(somaDias(data,j)); }
    var criadas=0, repetidas=0;
    datas.forEach(function(d){
      var t={};
      for(var k in base) t[k]=base[k];
      t.id=id('t'); t.data=d; t.feita=false; t.manual=true; t.travada=true;
      t.assinatura='manual:'+t.id;
      /* mesma tarefa, mesmo dia: não entra duas vezes */
      if(jaExisteNoDia(t)){ repetidas++; return; }
      E.tarefas.push(t);
      criadas++;
    });
    E.tarefas.sort(function(a,b){
      return a.data.localeCompare(b.data)||a.prioridade-b.prioridade;
    });
    salvar(); render();
    if(!criadas){
      flutuante('Essa tarefa já está nesse dia — não dupliquei.');
    } else {
      flutuante((criadas>1 ? criadas+' tarefas adicionadas' : 'Tarefa adicionada em '+dataCurta(data))+
                (repetidas ? ' · '+repetidas+' já existia'+(repetidas>1?'m':'')+' e não repeti.' : '.'));
    }
  });
}

function editarTarefa(idt){
  var t=null;
  E.tarefas.forEach(function(x){ if(x.id===idt) t=x; });
  if(!t) return;
  var corpo=formTarefa(t)+
    '<div style="border-top:1px solid var(--line);padding-top:12px;margin-top:4px">'+
    '<button class="btn perigo" data-acao="del-tarefa" data-id="'+t.id+'">Excluir esta tarefa</button>'+
    (t.manual?'':'<p style="font-size:11px;color:var(--muted);margin:8px 0 0">Esta tarefa foi criada pelo planner. '+
      'Ao excluir, ela não volta no próximo recálculo — dá para trazer todas de volta em Configurações.</p>')+
    '</div>';
  abrirModal('Editar tarefa',corpo,function(){
    var dados=lerFormTarefa();
    if(!dados) return false;
    for(var k in dados) t[k]=dados[k];
    t.data=val('f-data')||t.data;
    t.travada=true;   /* editada à mão: o recálculo não sobrescreve */
    E.tarefas.sort(function(a,b){
      return a.data.localeCompare(b.data)||a.prioridade-b.prioridade;

  });

function excluirTarefa(idt){
  var t=null;
  E.tarefas.forEach(function(x){ if(x.id===idt) t=x; });
  if(!t) return;
  if(!t.manual){
    E.removidas=E.removidas||[];
    if(E.removidas.indexOf(t.assinatura)<0) E.removidas.push(t.assinatura);
  }
  E.tarefas=E.tarefas.filter(function(x){ return x.id!==idt; });
  salvar(); fecharModal(); render(); flutuante('Tarefa excluída.');

/* ----- pendências de dias anteriores ----- */
function tarefasAtrasadas(){
  var hoje=hojeISO();
  return E.tarefas.filter(function(t){ return !t.feita && t.data<hoje; })
    .sort(function(a,b){ return a.data.localeCompare(b.data)||a.prioridade-b.prioridade; });
}

function moverTarefa(t,dia){
  t.adiadaDe=t.adiadaDe||t.data;
  t.data=dia;
  t.travada=true;
  t.assinatura=String(t.assinatura).split('@')[0]+'@'+dia;
}

/* Escolhe sozinho um bom dia para receber uma tarefa adiada:
   o que tem mais folga, de preferência num dia em que ela tem aquela
   matéria na escola, e o mais cedo possível dentro disso. */
function melhorDiaPara(t,base,limite){
  base=base||hojeISO();
  limite=limite||8;
  var melhor=null, melhorNota=null;
  for(var i=1;i<=limite;i++){
    var d=somaDias(base,i);
    var cap=capacidade(d);
    if(cap<=0) continue;
    if(jaTemIgual(t,d)) continue;
    if(!podeNoDia(t,d)) continue;
    var usado=soma(E.tarefas.filter(function(x){ return x.data===d && !x.feita; }),
      function(x){ return x.minutos; });
    var folga=cap-usado;
    var n=folga;
    if(folga<t.minutos) n-=80;                                     /* dia que já não comporta */
    if(t.materia && materiasDoDia(d).indexOf(t.materia)>=0) n+=40; /* casa com a aula do dia */
    n-=i*4;                                                        /* quanto antes, melhor */
    if(melhorNota===null||n>melhorNota){ melhorNota=n; melhor=d; }
  }
  return melhor||somaDias(base,1);
}

/* Cota de blocos de prova antiga daquele dia. 0 = o dia não recebe nenhum. */
/* Grupo do rodízio a que a tarefa pertence, lido da assinatura
   (prova_antiga:<vest>:<grupo>:<dia>:<n>). Serve para não repetir o mesmo
   grupo duas vezes no mesmo dia, mesmo que a tarefa tenha vindo de um remanejo. */
function grupoDaTarefa(t){
  if(t.cat!=='prova_antiga') return null;
  var partes=String(t.assinatura).split('@')[0].split(':');
  return partes.length>=3 ? partes[2] : (t.materia||t.titulo);
}

function cotaDe(lista,dia,padrao){
  var wd=diaSemana(dia);
  return (lista && lista.length===7) ? (lista[wd]||0) : padrao;
}
function cotaAulas(dia){ return cotaDe(E.config.aulasPorDia,dia,1); }
function cotaListas(dia){ return cotaDe(E.config.listasPorDia,dia,1); }

function cotaPA(dia){
  var wd=diaSemana(dia);
  var lista=E.config.blocosPorDia;
  if(lista && lista.length===7) return lista[wd]||0;
  return (wd===0||wd===6) ? (E.config.blocosFimSemana||0) : (E.config.blocosDiaUtil||0);
}

/* Diz se uma tarefa automática pode ficar naquele dia. É o que mantém as provas
   antigas e o treino de simulado no fim de semana mesmo depois de remanejos. */
function podeNoDia(t,dia,jaNoDia){
  if(t.manual) return true;
  if(t.fixadaPorMim) return true;   /* você mandou para esse dia; o app não desfaz */
  if(t.cat==='aula_atrasada'||t.cat==='lista'){
    var cotaC=(t.cat==='aula_atrasada')?cotaAulas(dia):cotaListas(dia);
    if(cotaC<=0) return false;
    var nC=E.tarefas.filter(function(x){
      return x.data===dia && x.cat===t.cat && x.id!==t.id && !x.feita;
    }).length;
    return nC<cotaC;
  }
  if(t.cat==='prova_antiga'){
    var cota=cotaPA(dia);
    if(cota<=0) return false;
    var g=grupoDaTarefa(t);
    var repetido=false;
    E.tarefas.forEach(function(x){
      if(x.id===t.id||x.feita||x.data!==dia||x.cat!=='prova_antiga') return;
      if(grupoDaTarefa(x)===g) repetido=true;
    });
    if(repetido) return false;
    var n=(jaNoDia===undefined) ? E.tarefas.filter(function(x){
      return x.data===dia && x.cat==='prova_antiga' && x.id!==t.id && !x.feita;
    }).length : jaNoDia;
    return n<cota;
  }
  if(t.cat==='simulado' && E.config.simuladoFimDeSemana &&
     String(t.assinatura).indexOf('simulado_prep:')===0){
    var wd=diaSemana(dia);
    return wd===0||wd===6;
  }
  return true;
}

function baseAssinatura(t){ return String(t.assinatura).split('@')[0]; }

/* Evita duplicata boba ao remanejar: o Anki atrasado de ontem não deve virar
   um segundo "Anki do dia" num dia que já tem o dele. */
function jaTemIgual(t,dia){
  var base=baseAssinatura(t), chave=chaveEm(t,dia);
  for(var i=0;i<E.tarefas.length;i++){
    var x=E.tarefas[i];
    if(x.id===t.id||x.data!==dia) continue;
    /* conta também o que já está feito naquele dia: se você já fez, mandar
       outra igual para lá seria repetir */
    if(baseAssinatura(x)===base) return true;
    if(chaveNoDia(x)===chave) return true;
  }
  return false;
}

/* Espalha uma lista de tarefas pelos próximos dias com disponibilidade.
   Escolhe sempre o dia mais folgado, com preferência para o dia em que ela tem
   aquela matéria na escola e para as datas mais próximas. Devolve o que moveu,
   para que a redistribuição automática possa ser desfeita. */
function espalharTarefas(lista,base,horizonte){
  base=base||hojeISO();
  horizonte=horizonte||E.config.horizonteRedistribuicao||14;
  var dias=[];
  for(var i=0;i<horizonte;i++){
    var d=somaDias(base,i);
    if(capacidade(d)>0) dias.push(d);
  }
  if(!dias.length) return {movidas:[],descartadas:0};

  var carga={};
  dias.forEach(function(d){
    carga[d]=soma(E.tarefas.filter(function(t){ return t.data===d && !t.feita; }),
      function(t){ return t.minutos; });
  });

  var movidas=[], descartadas=0;
  lista.forEach(function(t){
    var candidatos=dias.filter(function(d){ return !jaTemIgual(t,d) && podeNoDia(t,d); });
    if(!candidatos.length){
      /* já existe uma igual em todos os dias — essa cópia é redundante */
      t.__descartar=true; descartadas++;
      return;
    }
    function notaDia(d){
      var n=capacidade(d)-carga[d];
      if(t.materia && materiasDoDia(d).indexOf(t.materia)>=0) n+=40; /* casa com a aula do dia */
      n-=difDias(base,d)*2;                                          /* mais cedo é melhor */
      return n;
    }
    var melhor=candidatos[0], max=notaDia(candidatos[0]);
    candidatos.forEach(function(d){
      var n=notaDia(d);
      if(n>max){ max=n; melhor=d; }
    });
    movidas.push({id:t.id,de:t.data,para:melhor,titulo:t.titulo});
    moverTarefa(t,melhor);
    carga[melhor]+=t.minutos;
  });

  E.tarefas=E.tarefas.filter(function(t){ return !t.__descartar; });
  E.tarefas.sort(function(a,b){ return a.data.localeCompare(b.data)||a.prioridade-b.prioridade; });
  return {movidas:movidas,descartadas:descartadas};
}

function distribuirAtrasadas(){
  var lista=tarefasAtrasadas();
  if(!lista.length) return;
  var r=espalharTarefas(lista);
  if(!r.movidas.length && !r.descartadas){
    flutuante('Nenhum dia com disponibilidade à frente.');
    return;
  }
  salvar(); render();
  flutuante(r.movidas.length+' tarefa(s) redistribuídas'+
    (r.descartadas?' · '+r.descartadas+' repetida(s) descartada(s)':'')+'.');
}

/* Roda sozinha ao abrir o app, uma vez por dia: o que ficou para trás já
   aparece espalhado pelas próximas semanas, sem ela precisar pedir. */
function redistribuirAutomatico(){
  if(!E.config.redistribuirAuto) return;
  E.autoRedistribuicao=E.autoRedistribuicao||{ultima:null,movidas:[]};
  var hoje=hojeISO();
  if(E.autoRedistribuicao.ultima===hoje) return;
  var lista=tarefasAtrasadas();
  E.autoRedistribuicao.ultima=hoje;
  if(!lista.length){ E.autoRedistribuicao.movidas=[]; salvar(); return; }
  var r=espalharTarefas(lista);
  E.autoRedistribuicao.movidas=r.movidas;
  E.comandos.unshift({id:id('c'),data:new Date().toISOString(),comando:'redistribuição automática',
    resultado:r.movidas.length+' tarefa(s) de dias anteriores espalhadas'});
  E.comandos=E.comandos.slice(0,60);
  salvar();
}

function desfazerRedistribuicao(){
  var a=E.autoRedistribuicao;
  if(!a||!a.movidas||!a.movidas.length) return;
  a.movidas.forEach(function(m){
    E.tarefas.forEach(function(t){
      if(t.id!==m.id) return;
      t.data=m.de;
      t.assinatura=String(t.assinatura).split('@')[0];
    });
  });
  a.movidas=[];
  E.tarefas.sort(function(a2,b2){ return a2.data.localeCompare(b2.data)||a2.prioridade-b2.prioridade; });
  salvar(); render(); flutuante('Redistribuição desfeita — tudo voltou para os dias de origem.');
}

/* Aviso do que foi remanejado sozinho, com opção de desfazer. */
function cartaoAutoRedistribuicao(){
  var a=E.autoRedistribuicao;
  if(!a||a.ultima!==hojeISO()||!a.movidas||!a.movidas.length) return '';
  var destinos={};
  a.movidas.forEach(function(m){ destinos[m.para]=(destinos[m.para]||0)+1; });
  var resumo=Object.keys(destinos).sort().map(function(d){
    return dataCurta(d)+' ('+destinos[d]+')';
  }).join(' · ');
  return '<div class="cartao" style="border-color:var(--accent2)"><h2>Já reorganizei para você</h2>'+
    '<p style="font-size:12px;color:var(--muted);margin:-6px 0 10px">'+a.movidas.length+
    ' tarefa(s) que ficaram para trás foram espalhadas sozinhas pelos próximos dias: '+esc(resumo)+'.</p>'+
    '<button class="btn" data-acao="desfazer-auto">Desfazer</button> '+
    '<button class="btn mini" data-acao="ok-auto">Está bom</button></div>';
}

function puxarAtrasadasParaHoje(){
  var lista=tarefasAtrasadas(), hoje=hojeISO(), movidas=0, descartadas=0;
  lista.forEach(function(t){
    if(jaTemIgual(t,hoje)){ t.__descartar=true; descartadas++; return; }
    moverTarefa(t,hoje); movidas++;
  });
  E.tarefas=E.tarefas.filter(function(t){ return !t.__descartar; });
  salvar(); render();
  flutuante(movidas+' tarefa(s) trazidas para hoje'+(descartadas?' · '+descartadas+' repetida(s) descartada(s)':'')+'.');
}

function descartarAtrasadas(){
  var lista=tarefasAtrasadas();
  if(!confirm('Descartar '+lista.length+' tarefa(s) atrasada(s)? Elas somem do planner sem entrar no seu histórico.')) return;
  E.removidas=E.removidas||[];
  lista.forEach(function(t){
    if(!t.manual && E.removidas.indexOf(t.assinatura)<0) E.removidas.push(t.assinatura);
  });
  var ids={};
  lista.forEach(function(t){ ids[t.id]=1; });
  E.tarefas=E.tarefas.filter(function(t){ return !ids[t.id]; });
  salvar(); render(); flutuante('Atrasadas descartadas.');
}

  if(!lista.length) return '';
  /* com a redistribuição automática ligada, isso só aparece se algo escapou

  var h='<div class="cartao" style="border-color:var(--amber)"><h2>Ficou para trás</h2>'+
    '<p style="font-size:12px;color:var(--muted);margin:-6px 0 10px">'+lista.length+
    ' tarefa(s) de dias anteriores não foram feitas — '+horas(min)+' no total. '+
    'Nada foi perdido: escolha o que fazer com elas.</p>'+
    '<div style="display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px">'+
      '<button class="btn primario" data-acao="distribuir">Distribuir nos próximos dias</button>'+
      '<button class="btn" data-acao="puxar-hoje">Trazer tudo para hoje</button>'+
      '<button class="btn perigo" data-acao="descartar-atrasadas">Descartar</button>'+
    '</div><ul class="lista">';
  lista.slice(0,12).forEach(function(t){
    h+='<li><span class="selo ambar">'+dataCurta(t.data)+'</span>'+

       selo(rotuloCat(t.cat),'',t.materia?corDisc(t.materia):(CORES_CAT[t.cat]||null))+'</div></div>'+
       '<span class="min">'+horas(t.minutos)+'</span>'+

  h+='</ul></div>';
  return h;

/* Edição da prova escolar, incluindo o checklist inteiro.
   Itens que continuam com o mesmo nome mantêm o que já foi marcado e o tempo
   registrado; os que saírem levam junto a sessão de estudo correspondente. */
/* Atalhos de destino usados nas telas de mover. */
function proximoDiaSemana(base,wd){
  var delta=(wd-diaSemana(base)+7)%7;
  return somaDias(base,delta===0?7:delta);
}
function atalhosDestino(base,sugerido){
  return '<div style="display:flex;flex-wrap:wrap;gap:6px;margin:-4px 0 12px">'+
    (sugerido? '<button class="btn mini suave" data-acao="destino" data-d="'+sugerido+'">'+
      '★ Melhor dia · '+DIAS_CURTO[diaSemana(sugerido)]+' '+dataCurta(sugerido)+'</button>' : '')+
    '<button class="btn mini" data-acao="destino" data-d="'+somaDias(base,1)+'">Amanhã</button>'+
    '<button class="btn mini" data-acao="destino" data-d="'+somaDias(base,2)+'">Depois de amanhã</button>'+
    '<button class="btn mini" data-acao="destino" data-d="'+proximoDiaSemana(base,6)+'">Sábado</button>'+
    '<button class="btn mini" data-acao="destino" data-d="'+proximoDiaSemana(base,0)+'">Domingo</button>'+
    '<button class="btn mini" data-acao="destino" data-d="'+somaDias(base,7)+'">Semana que vem</button>'+
    '</div>';
}

/* Move uma tarefa só, sem mexer no resto do dia. */
function moverUmaModal(idt){
  var t=null;
  E.tarefas.forEach(function(x){ if(x.id===idt) t=x; });
  if(!t) return;
  var sugerido=melhorDiaPara(t,t.data);
  abrirModal('Mover para outro dia',
    '<p style="font-size:13px;margin:-8px 0 12px">'+esc(t.titulo)+
    ' <span style="color:var(--muted)">· '+horas(t.minutos)+' · hoje em '+dataCurta(t.data)+'</span></p>'+
    atalhosDestino(t.data,sugerido)+
    campo('Para o dia','f-destino','date',sugerido)+
    '<p style="font-size:11px;color:var(--muted);margin-top:-6px">Sugeri '+
    DIAS_LONGO[diaSemana(sugerido)].toLowerCase()+', '+dataCurta(sugerido)+
    ': é o dia mais folgado dos próximos'+
    (t.materia && materiasDoDia(sugerido).indexOf(t.materia)>=0

    function(){

      if(jaTemIgual(t,destino)){
        alert('Em '+dataCurta(destino)+' já existe essa mesma tarefa. Escolha outro dia.');
        return false;
      }
      moverTarefa(t,destino);
      t.fixadaPorMim=true;
      E.tarefas.sort(function(a,b){ return a.data.localeCompare(b.data)||a.prioridade-b.prioridade; });
      salvar(); render(); flutuante('"'+t.titulo+'" foi para '+dataCurta(destino)+'.');
    });
}

/* Escolhe no braço quais tarefas daquele dia vão para outro — o resto do dia fica. */
function moverParteModal(dia){
  dia=dia||hojeISO();
  var lista=tarefasDoDia(dia).filter(function(t){ return !t.feita; });
  if(!lista.length){ flutuante('Não há nada em aberto nesse dia.'); return; }
  var itens=lista.map(function(t){
    return '<label style="display:flex;align-items:flex-start;gap:9px;padding:7px 0;'+
      'border-top:1px solid var(--line);cursor:pointer">'+
      '<input type="checkbox" class="chk-mover" value="'+t.id+'" style="width:auto;margin-top:3px">'+
      '<span style="flex:1;min-width:0"><span style="font-size:13px">'+esc(t.titulo)+'</span> '+
      selo(rotuloCat(t.cat),'',t.materia?corDisc(t.materia):(CORES_CAT[t.cat]||null))+
      '<span style="display:block;font-size:11px;color:var(--muted)">'+horas(t.minutos)+'</span></span></label>';
  }).join('');

  var sugeridoParte=melhorDiaPara({minutos:Math.round(soma(lista,function(t){return t.minutos;})/lista.length),
    assinatura:'x',id:'x'},dia);
  abrirModal('Mover parte do dia',
    '<p style="font-size:12px;color:var(--muted);margin:-8px 0 10px">'+
    'Marque só o que quer mandar para outro dia — o resto de '+dataCurta(dia)+' continua onde está.</p>'+
    '<div style="display:flex;gap:6px;margin-bottom:8px">'+
      '<button class="btn mini" data-acao="marcar-todas">Marcar todas</button>'+
      '<button class="btn mini" data-acao="desmarcar-todas">Desmarcar</button>'+
    '</div>'+
    '<div style="max-height:34vh;overflow-y:auto;margin-bottom:14px">'+itens+'</div>'+
    atalhosDestino(dia,sugeridoParte)+
    campo('Para o dia','f-destino','date',sugeridoParte),
    function(){
      var destino=val('f-destino');
      if(!destino) return false;
      var marcadas=[];
      var caixas=document.querySelectorAll('.chk-mover');
      for(var i=0;i<caixas.length;i++){
        if(caixas[i].checked) marcadas.push(caixas[i].value);
      }
      if(!marcadas.length){ alert('Marque pelo menos uma tarefa.'); return false; }
      var movidas=0, repetidas=0;
      marcadas.forEach(function(idt){
        var t=null;
        E.tarefas.forEach(function(x){ if(x.id===idt) t=x; });
        if(!t) return;
        if(jaTemIgual(t,destino)){ repetidas++; return; }
        moverTarefa(t,destino); t.fixadaPorMim=true; movidas++;
      });
      E.tarefas.sort(function(a,b){ return a.data.localeCompare(b.data)||a.prioridade-b.prioridade; });
      salvar(); render();
      flutuante(movidas+' tarefa(s) movidas para '+dataCurta(destino)+
        (repetidas? ' · '+repetidas+' já existiam lá e ficaram' : '')+'.');
    });
}

}

/* Gera uma cópia do próprio arquivo com o estado atual embutido. Abrindo essa
   cópia em qualquer aparelho, tudo aparece — sem servidor, sem conta, sem nuvem. */
/* Coleções com id — a junção entre aparelhos é feita item a item. */
var COLECOES=['tarefas','questoes','provasAntigas','listas','aulas','redacoes',
  'provasEscolares','simulados','obras','sessoes','duvidas','dificuldades',
  'retomadas','disciplinas','vestibulares'];

/* Um item "mais adiantado" nunca é desfeito pela junção: se num aparelho a
   tarefa está feita e no outro não, ela fica feita. */
function maisAdiantado(a,b){
  function peso(x){
    var f=x.feita?1:0;
    var st=(x.status==='concluida'||x.status==='recuperada'||x.status==='resolvida'||
      x.status==='realizado'||x.status==='entregue'||x.status==='feita')?1:0;
    return f+st;
  }
  var pa=peso(a), pb=peso(b);
  if(pa!==pb) return pa>pb ? a : b;
  return null;
}

function mesclarEstados(local,vindo){
  var vindoMaisNovo = String(vindo.ultimaAlteracao||'') > String(local.ultimaAlteracao||'');
  var base = vindoMaisNovo ? vindo : local;
  var outro = vindoMaisNovo ? local : vindo;

  var resultado={};
  for(var k in base) resultado[k]=base[k];
  resultado.config = base.config;

  COLECOES.forEach(function(col){
    var mapa={}, ordem=[];
    (base[col]||[]).forEach(function(it){
      if(it&&it.id){ mapa[it.id]=it; ordem.push(it.id); }
    });
    (outro[col]||[]).forEach(function(it){
      if(!it||!it.id) return;
      if(mapa[it.id]){
        var vencedor=maisAdiantado(mapa[it.id],it);
        if(vencedor) mapa[it.id]=vencedor;      /* empate mantém o do lado mais novo */
      } else {
        mapa[it.id]=it; ordem.push(it.id);
      }
    });
    var juntos=[], jaVi={};
    ordem.forEach(function(idx){
      if(jaVi[idx]) return;
      jaVi[idx]=1;
      juntos.push(mapa[idx]);
    });
    resultado[col]=juntos;
  });

  resultado.removidas=(base.removidas||[]).concat(outro.removidas||[]).filter(function(v,i,a){
    return a.indexOf(v)===i;
  });
  resultado.ultimaAlteracao=new Date().toISOString();
  return resultado;
}

/* Aceita tanto o backup .json quanto a cópia .html com dados embutidos. */
function extrairDados(texto){
  try{
    var direto=JSON.parse(texto);
    if(direto&&direto.config) return direto;
  }catch(e){}
  var m=texto.match(/<script[^>]*id="medtrack-dados"[^>]*>([\s\S]*?)<\/script>/);
  if(m){
    try{
      var obj=JSON.parse(m[1]);
      if(obj&&obj.config) return obj;
    }catch(e2){}
  }
  return null;
}

/* =====================================================================
   SINCRONIZAÇÃO ENTRE APARELHOS
   O app continua funcionando offline. Quando você liga a sincronização,
   ele guarda uma cópia do estado numa "sala" na internet e junta o que
   vier de lá com o que está aqui — usando a mesma junção item a item do
   botão de arquivo, então nada se perde nem volta atrás.
   ===================================================================== */
var SINC={ocupado:false,ultimo:null,erro:null};

var SITE_MEDTRACK='https://eloisaschmitt321-dot.github.io/medtrack/';

function servidorSala(){
  var srv=String(E.config.sincServidor||'').replace(/\/+$/,'');
  /* o kvdb.io passou a exigir cadastro por e-mail; quem tinha o endereço antigo
     salvo é migrado sem perder a sala */
  if(!srv||srv.indexOf('kvdb.io')>=0) srv='https://jsonblob.com/api/jsonBlob';
  return srv;
}

function urlSala(){
  return servidorSala()+'/'+E.config.sincSala;
}

/* endereço que abre o app já dentro da sala — é o que você manda para o outro
   aparelho, para não precisar digitar o código na mão */
function linkSala(){
  var base=SITE_MEDTRACK;
  if(location.protocol==='http:'||location.protocol==='https:') base=location.origin+location.pathname;
  return base+'#sala='+E.config.sincSala;
}

function podeSincronizar(){
  return !!(E.config.sincAtivo && E.config.sincSala);
}

function sincStatus(txt,erro){
  SINC.erro=erro||null;
  SINC.ultimo=txt;
  var el=document.getElementById('sinc-status');
  if(el) el.innerHTML=txt;
}

/* cria uma sala nova e devolve o código para você usar no outro aparelho */
function sincCriarSala(){
  var srv=servidorSala();
  sincStatus('Criando sala…');
  fetch(srv,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(E)})
    .then(function(r){
      if(!r.ok&&r.status!==201) throw new Error('resposta '+r.status);
      var loc=r.headers.get('Location')||r.headers.get('location')||'';
      return String(loc).split('/').pop();
    })
    .then(function(txt){
      var codigo=String(txt||'').replace(/[^A-Za-z0-9_-]/g,'');
      if(!codigo) throw new Error('o servidor não devolveu o código da sala');
      E.config.sincSala=codigo;
      E.config.sincAtivo=true;
      salvar();
      sincEnviar(true);
      render();
      flutuante('Sala criada: '+codigo);
    })
    .catch(function(e){
      sincStatus('Não consegui criar a sala: '+e.message,true);
      render();
    });
}

function sincEnviar(silencioso){
  if(!podeSincronizar()||SINC.ocupado) return;
  SINC.ocupado=true;
  if(!silencioso) sincStatus('Enviando…');
  fetch(urlSala(),{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify(E)})
    .then(function(r){
      if(!r.ok) throw new Error('resposta '+r.status);
      sincStatus('Tudo enviado · '+new Date().toLocaleTimeString('pt-BR').slice(0,5));
    })
    .catch(function(e){ sincStatus('Falha ao enviar: '+e.message,true); })
    .then(function(){ SINC.ocupado=false; });
}

/* busca o que está na sala e junta com o daqui */
function sincBuscar(silencioso){
  if(!podeSincronizar()||SINC.ocupado) return;
  SINC.ocupado=true;
  if(!silencioso) sincStatus('Buscando…');
  fetch(urlSala()+'?t='+new Date().getTime())
    .then(function(r){
      if(r.status===404) return null;
      if(!r.ok) throw new Error('resposta '+r.status);
      return r.text();
    })
    .then(function(txt){
      SINC.ocupado=false;
      if(!txt){ sincEnviar(true); return; }
      var vindo=extrairDados(txt);
      if(!vindo){ sincStatus('A sala tem algo que não consegui ler.',true); return; }
      var antes=JSON.stringify(E).length;
      /* a sala é configuração DESTE aparelho: a junção não pode trazer o
         endereço/código de outro e derrubar a sincronização no meio do caminho */
      var meuSrv=E.config.sincServidor, minhaSala=E.config.sincSala, meuAtivo=E.config.sincAtivo;
      E=mesclarEstados(E,vindo);
      E.config.sincServidor=meuSrv; E.config.sincSala=minhaSala; E.config.sincAtivo=meuAtivo;
      salvar();
      sincStatus('Sincronizado · '+new Date().toLocaleTimeString('pt-BR').slice(0,5));
      render();
      if(JSON.stringify(E).length!==antes) sincEnviar(true);
    })
    .catch(function(e){
      SINC.ocupado=false;
      sincStatus('Falha ao buscar: '+e.message,true);
    });
}

function sincAgora(){
  if(!podeSincronizar()){ flutuante('Ligue a sincronização e crie ou entre numa sala.'); return; }
  sincBuscar(false);
}

function exportarAppComDados(){
  var clone=document.documentElement.cloneNode(true);

  /* limpa o que é só tela: modal aberto, aviso flutuante e a área renderizada */
  var lixo=clone.querySelector('#modal'); if(lixo) lixo.innerHTML='';
  lixo=clone.querySelector('#modal'); if(lixo) lixo.className='';
  lixo=clone.querySelector('#fundo'); if(lixo) lixo.className='';
  lixo=clone.querySelector('#aviso-flutuante'); if(lixo){ lixo.className=''; lixo.textContent=''; }
  lixo=clone.querySelector('#conteudo'); if(lixo) lixo.innerHTML='';
  lixo=clone.querySelector('#lateral'); if(lixo) lixo.innerHTML='';

  var antigo=clone.querySelector('#medtrack-dados');
  if(antigo) antigo.parentNode.removeChild(antigo);

  var tag=document.createElement('script');
  tag.type='application/json';
  tag.id='medtrack-dados';
  /* escapar o < evita que um texto qualquer feche a tag antes da hora */
  tag.textContent=JSON.stringify(E).replace(/</g,'\\u003c');
  clone.querySelector('head').appendChild(tag);

  var html='<!doctype html>\n'+clone.outerHTML;
  var blob=new Blob([html],{type:'text/html'});
  var url=URL.createObjectURL(blob), link=document.createElement('a');
  link.href=url;
  link.download='MedTrack-com-meus-dados.html';
  document.body.appendChild(link); link.click(); document.body.removeChild(link);
  setTimeout(function(){ URL.revokeObjectURL(url); },1500);
  flutuante('Arquivo gerado. Mande ESSE arquivo para o outro aparelho.');
}

      [['','— nenhuma —']].concat(opcoesDisciplinas()),p.materia||'')+

    'com o tempo que registrou. Apagar uma linha remove também o tempo dela.</p>',
    function(){
      var linhas=val('f-conteudos').split('\n')
        .map(function(x){ return x.replace(/^\s+|\s+$/g,''); })
        .filter(function(x){ return x; });
      var antigos={};
      p.conteudos.forEach(function(c){ antigos[c.nome]=c; });

      var novos=linhas.map(function(nome){
        return antigos[nome] || {id:id('c'),nome:nome,feito:false,minutos:0};
      });

      /* conteúdo removido: apaga a sessão de estudo que ele tinha gerado */
      var mantidos={};
      novos.forEach(function(c){ mantidos[c.id]=1; });
      p.conteudos.forEach(function(c){
        if(!mantidos[c.id] && c.sessao){
          E.sessoes=E.sessoes.filter(function(x){ return x.id!==c.sessao; });
        }
      });

      p.titulo=val('f-titulo')||p.titulo;
      p.data=val('f-data')||p.data;
      p.materia=val('f-materia')||null;
      p.nota=val('f-nota')===''?null:parseFloat(val('f-nota'));
      p.conteudos=novos;

      limparTarefasDe(p.id);
      salvar(); regenerar(); render(); flutuante('Prova atualizada.');
    });

document.addEventListener('click',function(ev){
  var el=ev.target;
  while(el && el!==document.body && !el.getAttribute('data-acao')) el=el.parentNode;
  if(!el||el===document.body) return;
  var a=el.getAttribute('data-acao'), i=el.getAttribute('data-id');

  if(a==='ir'){ EstadoUI.pagina=el.getAttribute('data-p'); EstadoUI.aberta=null;
    document.getElementById('lateral').className=''; render(); return; }
  if(a==='tema'){
    E.config.tema = document.documentElement.className==='escuro' ? 'claro' : 'escuro';
    salvar(); render(); return;
  }
  if(a==='recalcular'){ regenerar(); render(); flutuante('Planejamento recalculado.'); return; }
  if(a==='tarefa'){ alternarTarefa(i); return; }
  if(a==='minutos'){
    var t=null;
    E.tarefas.forEach(function(x){ if(x.id===i) t=x; });
    if(!t) return;
    var novo=prompt('Duração em minutos para "'+t.titulo+'":',t.minutos);
    if(novo!==null){
      var n=parseInt(novo,10);
      if(n>0){ t.minutos=n; t.travada=true; salvar(); render(); }
    }
    return;
  }
  if(a==='cmd'){ comando(el.getAttribute('data-c')); return; }
  if(a==='semana'){
    var d=parseInt(el.getAttribute('data-d'),10);
    EstadoUI.semana = d===0 ? hojeISO() : somaDias(inicioSemana(EstadoUI.semana||hojeISO()), d*7);
    render(); return;
  }
  if(a==='topicos'){ EstadoUI.aberta = EstadoUI.aberta===i ? null : i; render(); return; }
  if(a==='status'){
    var dd=disciplina(el.getAttribute('data-d'));
    if(dd) dd.topicos.forEach(function(tp){
      if(tp.id===el.getAttribute('data-t')) tp.status=el.getAttribute('data-s');
    });
    salvar(); render(); return;
  }
  if(a==='aula'){
    E.aulas.forEach(function(x){
      if(x.id!==i) return;
      if(x.status==='aberta'){ x.status='recuperada'; x.recuperada=hojeISO(); }
      else { x.status='aberta'; x.recuperada=null; }
    });
    salvar(); render(); return;
  }
  if(a==='lista'){
    E.listas.forEach(function(x){
      if(x.id!==i) return;
      if(x.status==='pendente'){ x.status='concluida'; x.concluida=hojeISO(); }
      else x.status='pendente';
    });
    salvar(); render(); return;
  }
  if(a==='tempo-rapido'){
    var campoMin=document.getElementById('f-min');
    if(campoMin) campoMin.value=el.getAttribute('data-n');
    return;
  }
  if(a==='conteudo'){
    var prova=null, item=null;
    E.provasEscolares.forEach(function(p){
      if(p.id!==el.getAttribute('data-p')) return;
      prova=p;
      p.conteudos.forEach(function(c){ if(c.id===el.getAttribute('data-c')) item=c; });
    });
    if(!item) return;
    if(item.feito){
      /* desmarcou: tira o tempo do histórico junto */
      if(item.sessao) E.sessoes=E.sessoes.filter(function(x){ return x.id!==item.sessao; });
      item.feito=false; item.sessao=null; item.minutos=0;
      salvar(); render(); return;
    }
    perguntarTempo(item.nome+' — '+(prova.titulo||'prova escolar'),function(m){
      item.feito=true; item.minutos=m;
      if(m>0){
        var sid=id('s');
        item.sessao=sid;
        E.sessoes.push({id:sid,data:hojeISO(),materia:prova.materia||null,minutos:m,
          cat:'revisao_prova',titulo:'Revisão — '+item.nome});
      }
      salvar(); render();
      flutuante(m>0 ? horas(m)+' somados ao seu tempo de estudo de hoje.' : 'Conteúdo marcado.');
    });
    return;
  }
  if(a==='ler'||a==='ex'||a==='ler-quanto'||a==='ex-quanto'){
    var n2;
    if(a==='ler-quanto'||a==='ex-quanto'){
      var resp=prompt(a==='ler-quanto'?'Quantas páginas você leu?':'Quantos exercícios você fez?','0');
      if(resp===null) return;
      n2=parseInt(resp,10);
      if(isNaN(n2)) return;
    } else n2=parseInt(el.getAttribute('data-n'),10);
    var leitura = (a==='ler'||a==='ler-quanto');
    E.obras.forEach(function(o){
      if(o.id!==i) return;
      if(leitura) o.lidas=Math.max(0,Math.min(o.paginas,o.lidas+n2));
      else o.exFeitos=Math.max(0,Math.min(o.exTotal,o.exFeitos+n2));
    });
    salvar(); regenerar(); render(); return;
  }
  if(a==='edit-obra'){ editarObra(i); return; }
  if(a==='edit-prova-escolar'){ editarProvaEscolar(i); return; }
  if(a==='edit-dificuldade'){ editarDificuldade(i); return; }
  if(a==='edit-duvida'){ editarDuvida(i); return; }
  if(a==='filtro-duvida'){ EstadoUI.filtroDuvida=el.getAttribute('data-f'); render(); return; }
  if(a==='filtrar-duvida-materia'){
    EstadoUI.materiaDuvida=el.getAttribute('data-id')||null; render(); return;
  }
  if(a==='resolver-duvida'){
    (E.duvidas||[]).forEach(function(d){
      if(d.id!==i) return;
      if(d.status==='pendente'){ d.status='resolvida'; d.resolvidaEm=hojeISO(); }
      else { d.status='pendente'; d.resolvidaEm=null; }
    });
    salvar(); render(); return;
  }
  if(a==='del-duvida'){
    E.duvidas=(E.duvidas||[]).filter(function(d){ return d.id!==i; });
    salvar(); render(); flutuante('Dúvida removida.'); return;
  }
  if(a==='resolver-dificuldade'){
    (E.dificuldades||[]).forEach(function(x){
      if(x.id===i){ x.ativa=!x.ativa; if(!x.ativa) limparTarefasDe(x.id); }
    });
    salvar(); regenerar(); render(); return;
  }
  if(a==='del-dificuldade'){
    limparTarefasDe(i);
    E.dificuldades=(E.dificuldades||[]).filter(function(x){ return x.id!==i; });
    salvar(); regenerar(); render(); flutuante('Dificuldade removida.'); return;
  }
  if(a==='add-sugestao'){
    var dsug=disciplina(i);
    if(dsug){
      E.dificuldades.push({id:id('dif'),titulo:dsug.nome,materia:dsug.id,nivel:2,
        obs:'Sugerida pelo aproveitamento em questões.',ativa:true,criada:hojeISO()});
      salvar(); regenerar(); render(); flutuante(dsug.nome+' entrou nas suas dificuldades.');
    }
    return;
  }
  if(a==='ativar'){
    E.vestibulares.forEach(function(v){ if(v.id===i) v.ativo=!v.ativo; });
    salvar(); regenerar(); render(); return;
  }
  if(a==='toggle-vest'){
    var campoV=el.getAttribute('data-campo');
    E.vestibulares.forEach(function(v){
      if(v.id!==i) return;
      v[campoV]=!v[campoV];
      /* marcar pagamento implica que a inscrição foi feita */
      if(campoV==='pago'&&v.pago) v.inscrito=true;
      if(campoV==='inscrito'&&!v.inscrito) v.pago=false;
    });
    salvar(); render(); return;
  }
  if(a==='edit-vestibular'){ editarVestibular(i); return; }
  if(a==='novo-vestibular'){ novoVestibular(); return; }
  if(a==='del-vestibular'){
    var vd=null;
    E.vestibulares.forEach(function(v){ if(v.id===i) vd=v; });
    if(vd && !confirm('Excluir '+vd.nome+'?')) return;
    E.vestibulares=E.vestibulares.filter(function(v){ return v.id!==i; });
    salvar(); regenerar(); render(); flutuante('Vestibular excluído.'); return;
  }
  if(a==='distribuir'){ distribuirAtrasadas(); return; }
  if(a==='desfazer-auto'){ desfazerRedistribuicao(); return; }
  if(a==='ok-auto'){
    E.autoRedistribuicao.movidas=[]; salvar(); render(); return;
  }
  if(a==='puxar-hoje'){ puxarAtrasadasParaHoje(); return; }
  if(a==='descartar-atrasadas'){ descartarAtrasadas(); return; }
  if(a==='nova-tarefa'){ novaTarefa(el.getAttribute('data-dia')||null); return; }
  if(a==='edit-tarefa'){ editarTarefa(i); return; }
  if(a==='mover-uma'){ moverUmaModal(i); return; }
  if(a==='mover-parte'){ moverParteModal(el.getAttribute('data-dia')); return; }
  if(a==='destino'){
    var campoDest=document.getElementById('f-destino');
    if(campoDest) campoDest.value=el.getAttribute('data-d');
    return;
  }
  if(a==='marcar-todas'||a==='desmarcar-todas'){
    var marcar=(a==='marcar-todas');
    var cx=document.querySelectorAll('.chk-mover');
    for(var ci=0;ci<cx.length;ci++) cx[ci].checked=marcar;
    return;
  }
  if(a==='del-tarefa'){ excluirTarefa(i); return; }
  if(a==='restaurar'){
    E.removidas=[]; salvar(); regenerar(); render();
    flutuante('Tarefas automáticas restauradas.'); return;
  }
  if(a==='edit-aula'){ editarAula(i); return; }
  if(a==='edit-lista'){ editarLista(i); return; }
  if(a==='del-aula'){ excluirPendencia('aulas',i,'esta aula'); return; }
  if(a==='edit-redacao'){ editarRedacao(i); return; }
  if(a==='edit-simulado'){ editarSimulado(i); return; }
  if(a==='retomar-agora'){
    (E.retomadas||[]).forEach(function(r){ if(r.id===i) r.voltaEm=hojeISO(); });
    limparTarefasDe(i); salvar(); regenerar(); render();
    flutuante('Entrou no planejamento de hoje.'); return;
  }
  if(a==='adiar-retomada'){
    (E.retomadas||[]).forEach(function(r){ if(r.id===i) r.voltaEm=somaDias(r.voltaEm,7); });
    limparTarefasDe(i); salvar(); regenerar(); render(); return;
  }
  if(a==='del-retomada'){
    limparTarefasDe(i);
    E.retomadas=(E.retomadas||[]).filter(function(r){ return r.id!==i; });
    salvar(); regenerar(); render(); flutuante('Retirado da fila.'); return;
  }
  if(a==='del-questao'){ remover('questoes',i); return; }
  if(a==='del-prova-antiga'){ remover('provasAntigas',i); return; }
  if(a==='del-lista'){ excluirPendencia('listas',i,'esta lista'); return; }
  if(a==='del-redacao'){ remover('redacoes',i); return; }
  if(a==='del-simulado'){ remover('simulados',i); return; }
  if(a==='del-prova-escolar'){
    var pe=null;
    E.provasEscolares.forEach(function(x){ if(x.id===i) pe=x; });
    if(pe && !confirm('Excluir "'+(pe.titulo||'prova escolar')+'"? O tempo registrado no checklist sai junto.')) return;
    if(pe) pe.conteudos.forEach(function(c){
      if(c.sessao) E.sessoes=E.sessoes.filter(function(x){ return x.id!==c.sessao; });
    });
    limparTarefasDe(i);
    E.provasEscolares=E.provasEscolares.filter(function(x){ return x.id!==i; });
    salvar(); regenerar(); render(); flutuante('Prova excluída.');
    return;
  }
  if(a==='del-obra'){ excluirPendencia('obras',i,'esta obra'); return; }
  if(a==='fechar'){ fecharModal(); return; }

  if(a==='sinc-criar'){ sincCriarSala(); return; }
  if(a==='copiar-link-sala'){
    var lk=linkSala();
    try{
      if(navigator.clipboard&&navigator.clipboard.writeText){
        navigator.clipboard.writeText(lk).then(function(){ flutuante('Link copiado.'); },function(){ prompt('Copie o link:',lk); });
      }else{ prompt('Copie o link:',lk); }
    }catch(e){ prompt('Copie o link:',lk); }
    return;
  }
  if(a==='sinc-agora'){ sincAgora(); return; }
  if(a==='sinc-sair'){
    E.config.sincAtivo=false; salvar(); render();
    flutuante('Sincronização desligada. Seus dados continuam aqui.');
    return;
  }
  if(a==='sinc-entrar'){
    var codigo=prompt('Cole aqui o código da sala (aquele que aparece no outro aparelho):','');
    if(codigo===null) return;
    codigo=String(codigo).replace(/[^A-Za-z0-9_-]/g,'');
    if(!codigo){ flutuante('Código inválido.'); return; }
    E.config.sincSala=codigo;
    E.config.sincAtivo=true;
    salvar(); render();
    sincBuscar(false);
    return;
  }
  if(a==='exportar-app'){ exportarAppComDados(); return; }
  if(a==='usar-embutido'){
    var vindo=dadosEmbutidos();
    if(!vindo){ flutuante('Este arquivo não tem dados embutidos.'); return; }
    if(!confirm('Substituir os dados deste aparelho pelos que vieram no arquivo? O que está aqui será perdido.')) return;
    E=vindo; salvar(); render(); flutuante('Dados do arquivo carregados.');
    return;
  }
  if(a==='exportar'){
    var blob=new Blob([JSON.stringify(E,null,2)],{type:'application/json'});
    var url=URL.createObjectURL(blob), link=document.createElement('a');
    link.href=url; link.download='medtrack-backup-'+hojeISO()+'.json';
    document.body.appendChild(link); link.click(); document.body.removeChild(link);
    setTimeout(function(){ URL.revokeObjectURL(url); },1000);
    flutuante('Backup exportado.'); return;
  }
  if(a==='importar'){ document.getElementById('arquivo-backup').click(); return; }
  if(a==='zerar'){
    if(confirm('Isso apaga TUDO: tarefas, questões, provas, redações e configurações. Não dá para desfazer. Continuar?')){
      E=estadoInicial(); salvar(); regenerar(); render(); flutuante('Dados zerados.');
    }
    return;
  }
  if(FORMULARIOS[a]){ FORMULARIOS[a](); return; }
});

document.addEventListener('change',function(ev){
  var el=ev.target;
  if(el.getAttribute && el.getAttribute('data-cfg')){
    var chave=el.getAttribute('data-cfg');
    E.config[chave] = el.type==='number' ? (parseFloat(el.value)||0) : el.value;
    salvar();
    if(chave==='tema'){ render(); return; }
    if(chave==='blocosDiaUtil'||chave==='blocosFimSemana'){
      regenerar(); render(); flutuante('Provas antigas reorganizadas.');
    }
    return;
  }
  if(el.getAttribute && el.getAttribute('data-cfgbool')){
    E.config[el.getAttribute('data-cfgbool')] = el.value==='1';
    salvar(); render(); return;
  }
  if(el.getAttribute && el.getAttribute('data-grupos')!=null){
    var mapa={};
    E.disciplinas.forEach(function(d){ mapa[d.nome.toLowerCase()]=d.id; mapa[d.id]=d.id; });
    var grupos=[];
    el.value.split('\n').forEach(function(linha){
      linha=linha.replace(/^\s+|\s+$/g,'');
      if(!linha) return;
      var partes=linha.split(':');
      var nome=partes[0].replace(/^\s+|\s+$/g,'');
      var resto=partes.slice(1).join(':');
      var mats=(resto||nome).split(',').map(function(x){
        return mapa[x.replace(/^\s+|\s+$/g,'').toLowerCase()];
      }).filter(Boolean);
      if(nome && mats.length){
        grupos.push({id:'g_'+nome.toLowerCase().replace(/[^a-z0-9]+/g,'_'),nome:nome,materias:mats});
      }
    });
    if(grupos.length){ E.config.gruposPA=grupos; salvar(); regenerar(); render(); flutuante('Rodízio atualizado.'); }
    return;
  }
  if(el.getAttribute && el.getAttribute('data-cota')){
    var chaveCota=el.getAttribute('data-cota');
    var iCota=parseInt(el.getAttribute('data-i'),10);
    if(!E.config[chaveCota]||E.config[chaveCota].length!==7) E.config[chaveCota]=[0,0,0,0,0,0,0];
    E.config[chaveCota][iCota]=Math.max(0,parseInt(el.value,10)||0);
    salvar(); regenerar(); render(); flutuante('Planejamento reorganizado.');
    return;
  }
  if(el.getAttribute && el.getAttribute('data-pa')!=null){
    var idx=parseInt(el.getAttribute('data-pa'),10);
    if(!E.config.blocosPorDia||E.config.blocosPorDia.length!==7) E.config.blocosPorDia=[0,0,0,0,0,0,0];
    E.config.blocosPorDia[idx]=Math.max(0,parseInt(el.value,10)||0);
    salvar(); regenerar(); render(); flutuante('Provas antigas reorganizadas.');
    return;
  }
  if(el.getAttribute && el.getAttribute('data-disp')!=null){
    E.config.disponibilidade[parseInt(el.getAttribute('data-disp'),10)]=Math.max(0,parseInt(el.value,10)||0);
    salvar(); return;
  }
  if(el.id==='arquivo-backup' && el.files && el.files[0]){
    var leitor=new FileReader();
    leitor.onload=function(){
      var vindo=extrairDados(String(leitor.result));
      if(!vindo){ flutuante('Não consegui ler esse arquivo.'); return; }
      var juntar=confirm('Juntar os dados deste arquivo com os deste aparelho?\n\n'+
        'OK = juntar (nada se perde dos dois lados)\n'+
        'Cancelar = substituir tudo pelo arquivo');
      if(juntar){
        var antes=E.tarefas.length+E.questoes.length+(E.duvidas||[]).length;
        E=mesclarEstados(E,vindo);
        var depois=E.tarefas.length+E.questoes.length+(E.duvidas||[]).length;
        salvar(); render();
        flutuante('Juntado — '+Math.max(0,depois-antes)+' item(ns) vieram do outro aparelho.');
      } else {
        E=vindo; salvar(); render(); flutuante('Dados substituídos pelos do arquivo.');
      }
    };
    leitor.readAsText(el.files[0]);
    el.value='';
  }
});

document.getElementById('fundo').onclick=fecharModal;
document.getElementById('btn-menu').onclick=function(){

/* =======================================================================
   12. INÍCIO
   ======================================================================= */
/* Se o app ficar aberto durante a virada do dia, o que passou a estar atrasado
   é redistribuído sozinho — sem ela precisar recarregar nem clicar em nada. */
/* busca a cada minuto o que os outros aparelhos mandaram */
/* Entrar numa sala pelo endereço: .../medtrack/#sala=CODIGO
   É assim que o segundo aparelho entra sem digitar nada. */
function salaPelaURL(){
  var m=String(location.hash||'').match(/sala=([A-Za-z0-9_-]+)/);
  if(!m) return false;
  var codigo=m[1];
  if(E.config.sincSala===codigo&&E.config.sincAtivo){
    try{ history.replaceState(null,'',location.pathname+location.search); }catch(e){}
    return false;
  }
  E.config.sincSala=codigo;
  E.config.sincAtivo=true;
  salvar();
  try{ history.replaceState(null,'',location.pathname+location.search); }catch(e){}
  return true;
}

setInterval(function(){ if(podeSincronizar()) sincBuscar(true); },60000);
window.addEventListener('focus',function(){ if(podeSincronizar()) sincBuscar(true); });

/* fechar a aba não pode comer a última mexida: grava na hora e tenta avisar a sala */
window.addEventListener('pagehide',function(){
  salvarJa();
  if(podeSincronizar()&&navigator.sendBeacon){
    try{ navigator.sendBeacon(urlSala(),new Blob([JSON.stringify(E)],{type:'application/json'})); }catch(e){}
  }
});

var diaEmTela=hojeISO();
setInterval(function(){
  var agora=hojeISO();
  if(agora!==diaEmTela){
    diaEmTela=agora;
    redistribuirAutomatico();
    render();
  }
},60000);

(function iniciar(){
  var ini=inicioSemana(hojeISO()), fim=somaDias(ini,13), tem=false;
  E.tarefas.forEach(function(t){ if(t.data>=ini&&t.data<=fim) tem=true; });
  /* dados vieram dentro do arquivo: grava já no aparelho novo, para não
     depender de a Eloísa mexer em algo antes de fechar */
  if(DADOS_VIERAM_DO_ARQUIVO) salvar();
  if(salaPelaURL()) flutuante('Entrando na sala compartilhada…');
  if(podeSincronizar()) sincBuscar(true);
  if(!tem||PRECISA_REGERAR) regenerar(ini,14);
  redistribuirAutomatico();
  render();
})();
</script>
